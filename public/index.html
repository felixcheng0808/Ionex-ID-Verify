<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ionex ID Verify</title>
  <script src="/nav.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
    }

    .page { max-width: 1100px; margin: 0 auto; padding: 40px 20px 60px; }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 48px 20px 40px;
    }
    .hero h1 {
      font-size: 32px; font-weight: 800; color: #2d3748;
      margin-bottom: 10px; letter-spacing: -.5px;
    }
    .hero p { font-size: 16px; color: #718096; }

    /* ── Tool Cards ── */
    .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
    @media (max-width: 768px) { .tools { grid-template-columns: 1fr; } }

    .tool-card {
      background: white; border-radius: 16px; padding: 32px 28px;
      text-decoration: none; color: inherit;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      border: 2px solid transparent;
      transition: all .2s; display: flex; flex-direction: column; gap: 12px;
    }
    .tool-card:hover {
      border-color: #667eea;
      box-shadow: 0 8px 28px rgba(102,126,234,.2);
      transform: translateY(-2px);
    }
    .tool-icon { font-size: 36px; }
    .tool-card h2 { font-size: 20px; color: #2d3748; font-weight: 700; }
    .tool-card p  { font-size: 14px; color: #718096; line-height: 1.6; flex: 1; }
    .tool-cta {
      font-size: 14px; font-weight: 700; color: #667eea;
      display: flex; align-items: center; gap: 6px; margin-top: 4px;
    }

    /* ── Status + Stats Row ── */
    .info-row { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
    @media (max-width: 768px) { .info-row { grid-template-columns: 1fr; } }

    .panel {
      background: white; border-radius: 16px; padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
    }
    .panel h3 { font-size: 14px; font-weight: 700; color: #4a5568; margin-bottom: 16px; }

    /* system status */
    .status-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid #f0f2f5; font-size: 13px;
    }
    .status-item:last-child { border-bottom: none; }
    .status-key { color: #718096; }
    .status-val { font-weight: 600; color: #2d3748; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
    .dot-green { background: #68d391; }
    .dot-red   { background: #fc8181; }
    .dot-gray  { background: #cbd5e0; }

    /* error stats */
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    @media (max-width: 640px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
    .stat-mini {
      text-align: center; padding: 14px 8px;
      background: #f7fafc; border-radius: 10px;
    }
    .stat-mini-val  { font-size: 26px; font-weight: 800; color: #2d3748; }
    .stat-mini-label{ font-size: 11px; color: #a0aec0; margin-top: 4px; }
    .stat-mini.red  .stat-mini-val { color: #e53e3e; }
    .stat-mini.orange .stat-mini-val { color: #dd6b20; }
    .stat-mini.yellow .stat-mini-val { color: #d69e2e; }

    .panel-footer {
      margin-top: 16px; padding-top: 12px; border-top: 1px solid #f0f2f5;
      text-align: right;
    }
    .panel-footer a { font-size: 13px; color: #667eea; text-decoration: none; font-weight: 600; }
    .panel-footer a:hover { text-decoration: underline; }

    .loading-text { color: #a0aec0; font-size: 13px; }
  </style>
</head>
<body>
<div class="page">

  <!-- Hero -->
  <div class="hero">
    <h1>Ionex ID Verify</h1>
    <p>台灣身分證 / 駕照辨識與審核管理系統</p>
  </div>

  <!-- Tool Cards -->
  <div class="tools">
    <a href="/document-review.html" class="tool-card">
      <div class="tool-icon">📋</div>
      <h2>證件審核</h2>
      <p>查詢待審核使用者，辨識身分證與駕照，確認違規紀錄，完成審核流程。</p>
      <div class="tool-cta">進入系統 →</div>
    </a>
    <a href="/verify-test.html" class="tool-card">
      <div class="tool-icon">🔍</div>
      <h2>OCR 測試</h2>
      <p>上傳圖片或貼上 URL 快速測試辨識效果，支援身分證與駕照，顯示原始文字與信心值。</p>
      <div class="tool-cta">開始測試 →</div>
    </a>
    <a href="/error-logs.html" class="tool-card">
      <div class="tool-icon">📊</div>
      <h2>錯誤紀錄</h2>
      <p>查詢審核流程中的錯誤，依步驟分析失敗原因，透過 Session ID 追蹤單筆問題。</p>
      <div class="tool-cta">查看紀錄 →</div>
    </a>
  </div>

  <!-- Status + Stats -->
  <div class="info-row">

    <!-- System Status -->
    <div class="panel">
      <h3>系統狀態</h3>
      <div id="systemStatus"><p class="loading-text">載入中...</p></div>
    </div>

    <!-- Today's Error Stats -->
    <div class="panel">
      <h3>今日錯誤摘要</h3>
      <div class="stat-grid" id="errorStats">
        <div class="stat-mini"><div class="stat-mini-val">—</div><div class="stat-mini-label">總錯誤數</div></div>
        <div class="stat-mini red"><div class="stat-mini-val">—</div><div class="stat-mini-label">硬錯誤</div></div>
        <div class="stat-mini orange"><div class="stat-mini-val">—</div><div class="stat-mini-label">OCR 問題</div></div>
        <div class="stat-mini yellow"><div class="stat-mini-val">—</div><div class="stat-mini-label">結果不完整</div></div>
      </div>
      <div class="panel-footer"><a href="/error-logs.html">查看所有錯誤紀錄 →</a></div>
    </div>

  </div>
</div>

<script>
  const HARD_CODES = ['DOWNLOAD_FAILED','INVALID_IMAGE','PREPROCESSING_FAILED','OCR_FAILED','PARSE_FAILED','VIOLATION_CHECK_FAILED','UNKNOWN_ERROR'];
  const OCR_CODES  = ['OCR_FAILED','OCR_LOW_CONFIDENCE','OCR_EMPTY_RESULT'];

  async function loadStatus() {
    const el = document.getElementById('systemStatus');
    try {
      const [health, status] = await Promise.all([
        fetch('/api/health').then(r => r.json()),
        fetch('/api/status').then(r => r.json()),
      ]);

      const ocr = status.ocr || {};
      el.innerHTML = `
        <div class="status-item">
          <span class="status-key">API 伺服器</span>
          <span class="status-val"><span class="dot dot-green"></span>運行中</span>
        </div>
        <div class="status-item">
          <span class="status-key">OCR 引擎</span>
          <span class="status-val">${ocr.engine || '—'}</span>
        </div>
        <div class="status-item">
          <span class="status-key">OCR 狀態</span>
          <span class="status-val">
            <span class="dot ${ocr.isInitialized ? 'dot-green' : 'dot-red'}"></span>
            ${ocr.isInitialized ? '已初始化' : '未初始化'}
          </span>
        </div>
        <div class="status-item">
          <span class="status-key">最後更新</span>
          <span class="status-val">${new Date().toLocaleTimeString('zh-TW')}</span>
        </div>
      `;
    } catch {
      el.innerHTML = `
        <div class="status-item">
          <span class="status-key">API 伺服器</span>
          <span class="status-val"><span class="dot dot-red"></span>無法連線</span>
        </div>
      `;
    }
  }

  async function loadErrorStats() {
    const today = new Date().toISOString().slice(0, 10);
    try {
      const r = await fetch(`/api/errors/stats?startDate=${today}&endDate=${today}`);
      const d = await r.json();
      if (!d.success) return;

      let hard = 0, ocr = 0, incomplete = 0;
      for (const [code, cnt] of Object.entries(d.byErrorCode || {})) {
        if (HARD_CODES.includes(code)) hard += cnt;
        if (OCR_CODES.includes(code))  ocr  += cnt;
        if (code === 'INCOMPLETE_RESULT') incomplete += cnt;
      }

      const el = document.getElementById('errorStats');
      el.innerHTML = `
        <div class="stat-mini"><div class="stat-mini-val">${d.total}</div><div class="stat-mini-label">總錯誤數</div></div>
        <div class="stat-mini red"><div class="stat-mini-val">${hard}</div><div class="stat-mini-label">硬錯誤</div></div>
        <div class="stat-mini orange"><div class="stat-mini-val">${ocr}</div><div class="stat-mini-label">OCR 問題</div></div>
        <div class="stat-mini yellow"><div class="stat-mini-val">${incomplete}</div><div class="stat-mini-label">結果不完整</div></div>
      `;
    } catch { /* silent */ }
  }

  loadStatus();
  loadErrorStats();
</script>
</body>
</html>
