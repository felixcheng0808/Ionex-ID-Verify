<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣身分證辨識系統 - Ionex ID Verify</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input[type="text"],
        .form-group input[type="file"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input[type="file"] {
            padding: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .result h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .result-item {
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 5px;
        }

        .result-item strong {
            display: inline-block;
            width: 120px;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .example-urls {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .example-urls p {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 8px;
        }

        .example-urls code {
            display: block;
            background: white;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 5px;
            cursor: pointer;
            border: 1px solid #e0e0e0;
        }

        .example-urls code:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .image-preview {
            margin-top: 15px;
            max-width: 100%;
            border-radius: 8px;
            display: none;
        }

        .image-preview img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 台灣身分證辨識系統</h1>
            <p>Ionex ID Verify - 支援 URL 與檔案上傳兩種辨識方式</p>
        </div>

        <!-- 方法一：透過 URL 辨識 -->
        <div class="card">
            <h2>📎 方法一：透過圖片 URL 辨識</h2>
            <form id="urlForm">
                <div class="form-group">
                    <label for="imageUrl">請輸入身分證圖片網址：</label>
                    <input type="text" id="imageUrl" name="imageUrl" placeholder="https://example.com/id-card.jpg">
                </div>

                <div class="example-urls">
                    <p>💡 範例網址（點擊自動填入）：</p>
                    <code onclick="fillUrl(this.textContent)">https://i.imgur.com/example1.jpg</code>
                    <code onclick="fillUrl(this.textContent)">https://example.com/taiwan-id.png</code>
                </div>

                <button type="submit" class="btn" id="urlBtn">開始辨識</button>
            </form>

            <div class="loading" id="urlLoading">
                <div class="spinner"></div>
                <p>正在辨識中，請稍候...</p>
            </div>

            <div class="result" id="urlResult"></div>
        </div>

        <!-- 方法二：透過上傳辨識 -->
        <div class="card">
            <h2>📤 方法二：上傳身分證圖片辨識</h2>
            <form id="uploadForm">
                <div class="form-group">
                    <label for="imageFile">請選擇身分證圖片檔案：</label>
                    <input type="file" id="imageFile" name="image" accept="image/jpeg,image/jpg,image/png,image/webp">
                </div>

                <div class="image-preview" id="imagePreview">
                    <img id="previewImg" src="" alt="圖片預覽">
                </div>

                <button type="submit" class="btn" id="uploadBtn">開始辨識</button>
            </form>

            <div class="loading" id="uploadLoading">
                <div class="spinner"></div>
                <p>正在辨識中，請稍候...</p>
            </div>

            <div class="result" id="uploadResult"></div>
        </div>

        <!-- 系統資訊 -->
        <div class="card">
            <h2>ℹ️ 系統資訊</h2>
            <div id="systemInfo">
                <p>載入中...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3888/api';

        // 載入系統資訊
        async function loadSystemInfo() {
            try {
                const response = await fetch(`${API_BASE_URL}/status`);
                const data = await response.json();

                const infoDiv = document.getElementById('systemInfo');
                infoDiv.innerHTML = `
                    <div class="result-item">
                        <strong>狀態：</strong>${data.status === 'running' ? '✅ 運行中' : '❌ 停止'}
                    </div>
                    <div class="result-item">
                        <strong>OCR 引擎：</strong>${data.ocr.engine || 'N/A'}
                    </div>
                    <div class="result-item">
                        <strong>已初始化：</strong>${data.ocr.isInitialized ? '✅ 是' : '❌ 否'}
                    </div>
                    <div class="result-item">
                        <strong>版本：</strong>${data.version || '1.0.0'}
                    </div>
                `;
            } catch (error) {
                document.getElementById('systemInfo').innerHTML = `
                    <p style="color: #dc3545;">⚠️ 無法連接到服務器，請確認服務已啟動</p>
                `;
            }
        }

        // 自動填入範例 URL
        function fillUrl(url) {
            document.getElementById('imageUrl').value = url;
        }

        // 圖片預覽
        document.getElementById('imageFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('imagePreview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                document.getElementById('imagePreview').style.display = 'none';
            }
        });

        // 處理 URL 辨識表單
        document.getElementById('urlForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const imageUrl = document.getElementById('imageUrl').value.trim();
            if (!imageUrl) {
                alert('請輸入圖片網址');
                return;
            }

            const resultDiv = document.getElementById('urlResult');
            const loadingDiv = document.getElementById('urlLoading');
            const btn = document.getElementById('urlBtn');

            // 顯示載入中
            loadingDiv.classList.add('active');
            resultDiv.style.display = 'none';
            btn.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/verify/url`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ imageUrl }),
                });

                const data = await response.json();

                // 隱藏載入中
                loadingDiv.classList.remove('active');
                btn.disabled = false;

                // 顯示結果
                if (data.success) {
                    displayResult(resultDiv, data, true);
                } else {
                    displayResult(resultDiv, data, false);
                }
            } catch (error) {
                loadingDiv.classList.remove('active');
                btn.disabled = false;
                displayError(resultDiv, '網路錯誤：' + error.message);
            }
        });

        // 處理上傳辨識表單
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fileInput = document.getElementById('imageFile');
            const file = fileInput.files[0];

            if (!file) {
                alert('請選擇圖片檔案');
                return;
            }

            const resultDiv = document.getElementById('uploadResult');
            const loadingDiv = document.getElementById('uploadLoading');
            const btn = document.getElementById('uploadBtn');

            // 顯示載入中
            loadingDiv.classList.add('active');
            resultDiv.style.display = 'none';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch(`${API_BASE_URL}/verify/upload`, {
                    method: 'POST',
                    body: formData,
                });

                const data = await response.json();

                // 隱藏載入中
                loadingDiv.classList.remove('active');
                btn.disabled = false;

                // 顯示結果
                if (data.success) {
                    displayResult(resultDiv, data, true);
                } else {
                    displayResult(resultDiv, data, false);
                }
            } catch (error) {
                loadingDiv.classList.remove('active');
                btn.disabled = false;
                displayError(resultDiv, '網路錯誤：' + error.message);
            }
        });

        // 顯示辨識結果
        function displayResult(resultDiv, data, isSuccess) {
            resultDiv.className = 'result ' + (isSuccess ? 'success' : 'error');
            resultDiv.style.display = 'block';

            if (isSuccess) {
                const idData = data.data;
                resultDiv.innerHTML = `
                    <h3>✅ 辨識成功</h3>
                    <div class="result-item">
                        <strong>身分證字號：</strong>${idData.idNumber || '未辨識'}
                    </div>
                    <div class="result-item">
                        <strong>姓名：</strong>${idData.name || '未辨識'}
                    </div>
                    <div class="result-item">
                        <strong>性別：</strong>${idData.gender || '未辨識'}
                    </div>
                    <div class="result-item">
                        <strong>出生日期：</strong>${idData.birthDate || '未辨識'}
                    </div>
                    <div class="result-item">
                        <strong>發證日期：</strong>${idData.issueDate || '未辨識'}
                    </div>
                    <div class="result-item">
                        <strong>發證地點：</strong>${idData.issueLocation || '未辨識'}
                    </div>
                    <div class="result-item">
                        <strong>信心度：</strong>${data.confidence ? data.confidence.toFixed(2) + '%' : 'N/A'}
                    </div>
                    <div style="margin-top: 20px;">
                        <a href="https://www.mvdis.gov.tw/m3-emv-vil/vil/driverLicensePenalty"
                           target="_blank"
                           class="btn"
                           style="display: inline-block; text-decoration: none; text-align: center;">
                            查詢駕照違規記錄 (開啟監理站網站)
                        </a>
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `
                    <h3>❌ 辨識失敗</h3>
                    <p>${data.error || data.message || '未知錯誤'}</p>
                `;
            }
        }

        // 顯示錯誤訊息
        function displayError(resultDiv, message) {
            resultDiv.className = 'result error';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <h3>❌ 發生錯誤</h3>
                <p>${message}</p>
            `;
        }

        // 頁面載入時獲取系統資訊
        loadSystemInfo();
    </script>
</body>
</html>
