<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ionex ID Verify</title>
  <link rel="stylesheet" href="/css/shadcn.css">
  <script src="/nav.js"></script>
  <style>
    .page { max-width: 1120px; margin: 0 auto; padding: 32px 20px 60px; }

    /* ── Hero ── */
    .hero { text-align: center; padding: 28px 20px 36px; }
    .hero h1 { font-size: 30px; font-weight: 800; letter-spacing: -.5px; margin-bottom: 8px; }
    .hero p { color: hsl(var(--muted-foreground)); }

    /* ── Tool Cards ── */
    .tools { margin-bottom: 32px; }
    .tool-card {
      text-decoration: none; color: inherit;
      padding: 28px 24px; display: flex; flex-direction: column; gap: 10px;
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .tool-card:hover {
      border-color: hsl(var(--primary));
      box-shadow: 0 8px 28px hsl(var(--primary) / .18);
      transform: translateY(-2px);
    }
    .tool-icon { font-size: 32px; }
    .tool-cta { margin-top: 4px; }

    /* system status */
    .status-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid hsl(var(--border)); font-size: 13px;
    }
    .status-item:last-child { border-bottom: none; }

    /* error stats */
    .stat-mini { text-align: center; padding: 14px 8px; background: hsl(var(--secondary)); border-radius: calc(var(--radius) - 2px); }
    .stat-mini-val  { font-size: 24px; font-weight: 800; }
    .stat-mini-label{ font-size: 11px; color: hsl(var(--muted-foreground)); margin-top: 4px; }
    .stat-mini.red    .stat-mini-val { color: hsl(var(--destructive)); }
    .stat-mini.orange .stat-mini-val { color: hsl(30 80% 45%); }
    .stat-mini.yellow .stat-mini-val { color: hsl(var(--warning)); }
  </style>
</head>
<body>
<div class="page">

  <!-- Hero -->
  <div class="hero">
    <h1>Ionex ID Verify</h1>
    <p>台灣身分證 / 駕照辨識與審核管理系統</p>
  </div>

  <!-- Tool Cards -->
  <div class="tools grid grid-cols-3 gap-4">
    <a href="/document-review.html" class="tool-card card">
      <div class="tool-icon">📋</div>
      <h2 class="text-lg font-bold">證件審核</h2>
      <p class="text-sm text-muted flex-1">查詢待審核使用者，辨識身分證與駕照，確認違規紀錄，完成審核流程。</p>
      <div class="tool-cta text-sm font-bold text-primary">進入系統 →</div>
    </a>
    <a href="/verify-test.html" class="tool-card card">
      <div class="tool-icon">🔍</div>
      <h2 class="text-lg font-bold">OCR 測試</h2>
      <p class="text-sm text-muted flex-1">上傳圖片或貼上 URL 快速測試辨識效果，支援身分證與駕照，顯示原始文字與信心值。</p>
      <div class="tool-cta text-sm font-bold text-primary">開始測試 →</div>
    </a>
    <a href="/error-logs.html" class="tool-card card">
      <div class="tool-icon">📊</div>
      <h2 class="text-lg font-bold">錯誤紀錄</h2>
      <p class="text-sm text-muted flex-1">查詢審核流程中的錯誤，依步驟分析失敗原因，透過 Session ID 追蹤單筆問題。</p>
      <div class="tool-cta text-sm font-bold text-primary">查看紀錄 →</div>
    </a>
  </div>

  <!-- Status + Stats -->
  <div class="grid grid-cols-2 gap-4">

    <!-- System Status -->
    <div class="card">
      <div class="card-header"><div class="card-title text-sm">系統狀態</div></div>
      <div class="card-content" id="systemStatus"><p class="text-sm text-muted">載入中...</p></div>
    </div>

    <!-- Today's Error Stats -->
    <div class="card">
      <div class="card-header"><div class="card-title text-sm">今日錯誤摘要</div></div>
      <div class="card-content">
        <div class="grid grid-cols-4 sm-grid-cols-2 gap-2" id="errorStats">
          <div class="stat-mini"><div class="stat-mini-val">—</div><div class="stat-mini-label">總錯誤數</div></div>
          <div class="stat-mini red"><div class="stat-mini-val">—</div><div class="stat-mini-label">硬錯誤</div></div>
          <div class="stat-mini orange"><div class="stat-mini-val">—</div><div class="stat-mini-label">OCR 問題</div></div>
          <div class="stat-mini yellow"><div class="stat-mini-val">—</div><div class="stat-mini-label">結果不完整</div></div>
        </div>
      </div>
      <div class="card-footer" style="justify-content:flex-end;">
        <a href="/error-logs.html" class="text-sm font-bold text-primary" style="text-decoration:none;">查看所有錯誤紀錄 →</a>
      </div>
    </div>

  </div>
</div>

<script>
  const HARD_CODES = ['DOWNLOAD_FAILED','INVALID_IMAGE','PREPROCESSING_FAILED','OCR_FAILED','PARSE_FAILED','VIOLATION_CHECK_FAILED','UNKNOWN_ERROR'];
  const OCR_CODES  = ['OCR_FAILED','OCR_LOW_CONFIDENCE','OCR_EMPTY_RESULT'];

  async function loadStatus() {
    const el = document.getElementById('systemStatus');
    try {
      const [health, status] = await Promise.all([
        fetch('/api/health').then(r => r.json()),
        fetch('/api/status').then(r => r.json()),
      ]);

      const ocr = status.ocr || {};
      el.innerHTML = `
        <div class="status-item">
          <span class="text-muted">API 伺服器</span>
          <span class="font-semibold flex items-center gap-2"><span class="dot dot-success"></span>運行中</span>
        </div>
        <div class="status-item">
          <span class="text-muted">OCR 引擎</span>
          <span class="font-semibold">${ocr.engine || '—'}</span>
        </div>
        <div class="status-item">
          <span class="text-muted">OCR 狀態</span>
          <span class="font-semibold flex items-center gap-2">
            <span class="dot ${ocr.isInitialized ? 'dot-success' : 'dot-destructive'}"></span>
            ${ocr.isInitialized ? '已初始化' : '未初始化'}
          </span>
        </div>
        <div class="status-item">
          <span class="text-muted">最後更新</span>
          <span class="font-semibold">${new Date().toLocaleTimeString('zh-TW')}</span>
        </div>
      `;
    } catch {
      el.innerHTML = `
        <div class="status-item">
          <span class="text-muted">API 伺服器</span>
          <span class="font-semibold flex items-center gap-2"><span class="dot dot-destructive"></span>無法連線</span>
        </div>
      `;
    }
  }

  async function loadErrorStats() {
    const today = new Date().toISOString().slice(0, 10);
    try {
      const r = await fetch(`/api/errors/stats?startDate=${today}&endDate=${today}`);
      const d = await r.json();
      if (!d.success) return;

      let hard = 0, ocr = 0, incomplete = 0;
      for (const [code, cnt] of Object.entries(d.byErrorCode || {})) {
        if (HARD_CODES.includes(code)) hard += cnt;
        if (OCR_CODES.includes(code))  ocr  += cnt;
        if (code === 'INCOMPLETE_RESULT') incomplete += cnt;
      }

      const el = document.getElementById('errorStats');
      el.innerHTML = `
        <div class="stat-mini"><div class="stat-mini-val">${d.total}</div><div class="stat-mini-label">總錯誤數</div></div>
        <div class="stat-mini red"><div class="stat-mini-val">${hard}</div><div class="stat-mini-label">硬錯誤</div></div>
        <div class="stat-mini orange"><div class="stat-mini-val">${ocr}</div><div class="stat-mini-label">OCR 問題</div></div>
        <div class="stat-mini yellow"><div class="stat-mini-val">${incomplete}</div><div class="stat-mini-label">結果不完整</div></div>
      `;
    } catch { /* silent */ }
  }

  loadStatus();
  loadErrorStats();
</script>
</body>
</html>
