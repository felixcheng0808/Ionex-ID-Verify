<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>錯誤紀錄查詢 - Ionex ID Verify</title>
  <link rel="stylesheet" href="/css/shadcn.css">
  <script src="/nav.js"></script>
  <style>
    /* ── Layout ── */
    .main { max-width: 1400px; margin: 0 auto; padding: 20px 20px 40px; }
    .page-toolbar {
      max-width: 1400px; margin: 0 auto; padding: 16px 20px 0;
      display: flex; align-items: center; gap: 10px; justify-content: flex-end;
      flex-wrap: wrap;
    }

    /* ── Stats Bar ── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat-card { border-left: 4px solid hsl(var(--primary)); padding: 16px 20px; }
    .stat-card.red    { border-left-color: hsl(var(--destructive)); }
    .stat-card.orange { border-left-color: hsl(30 80% 45%); }
    .stat-card.yellow { border-left-color: hsl(var(--warning)); }
    .stat-card.green  { border-left-color: hsl(var(--success)); }
    .stat-card.blue   { border-left-color: hsl(210 70% 50%); }
    .stat-label { font-size: 12px; color: hsl(var(--muted-foreground)); margin-bottom: 4px; }
    .stat-value { font-size: 26px; font-weight: 700; }

    /* ── Filter Panel ── */
    .filter-panel { padding: 20px 24px; margin-bottom: 20px; }
    .filter-panel h3 { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px; align-items: end;
    }
    .filter-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    @media (max-width: 640px) {
      .filter-actions .btn { flex: 1; }
    }

    /* ── Breakdown Cards ── */
    .breakdown-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    @media (max-width: 768px) { .breakdown-row { grid-template-columns: 1fr; } }
    .breakdown-card { padding: 18px 20px; }
    .breakdown-card h3 { font-size: 13px; font-weight: 700; margin-bottom: 12px; }
    .breakdown-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 0; border-bottom: 1px solid hsl(var(--border)); font-size: 13px;
    }
    .breakdown-item:last-child { border-bottom: none; }
    .breakdown-bar-wrap { flex: 1; margin: 0 12px; height: 6px; background: hsl(var(--secondary)); border-radius: 3px; overflow: hidden; }
    .breakdown-bar { height: 100%; background: hsl(var(--primary)); border-radius: 3px; transition: width .4s; }
    .breakdown-count { font-weight: 700; min-width: 28px; text-align: right; }
    .breakdown-label { color: hsl(var(--secondary-foreground)); min-width: 0; }

    /* ── Table ── */
    .table-panel { overflow: hidden; }
    .table-toolbar {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px;
      padding: 16px 20px; border-bottom: 1px solid hsl(var(--border));
    }
    .table-toolbar h3 { font-size: 14px; font-weight: 700; }
    .table-meta { font-size: 12px; color: hsl(var(--muted-foreground)); }
    #errorTable.table { min-width: 720px; }
    @media (max-width: 640px) {
      #errorTable.table { min-width: 0; }
      .td-msg { max-width: none; }
    }
    .td-time { font-family: monospace; font-size: 12px; color: hsl(var(--muted-foreground)); white-space: nowrap; }
    .td-session { font-family: monospace; font-size: 11px; color: hsl(var(--muted-foreground)); }
    .td-msg { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #errorTable tbody tr { cursor: pointer; }
    @media (max-width: 640px) {
      .td-msg { max-width: none; white-space: normal; }
    }

    /* ── Step / error-code badge colors (categorical, page-specific) ── */
    .badge-step-request_validation { background: #bee3f8; color: #2b6cb0; }
    .badge-step-image_download      { background: #feebc8; color: #c05621; }
    .badge-step-image_validation    { background: #feebc8; color: #c05621; }
    .badge-step-image_preprocessing { background: #fefcbf; color: #975a16; }
    .badge-step-ocr_recognition     { background: #fed7e2; color: #97266d; }
    .badge-step-data_parsing        { background: #e9d8fd; color: #6b46c1; }
    .badge-step-result_validation   { background: #c6f6d5; color: #276749; }
    .badge-step-violation_check     { background: #fee2e2; color: #991b1b; }

    .badge-code-VALIDATION_ERROR      { background: #bee3f8; color: #2b6cb0; }
    .badge-code-DOWNLOAD_FAILED       { background: #fed7e2; color: #c53030; }
    .badge-code-INVALID_IMAGE         { background: #fed7e2; color: #c53030; }
    .badge-code-PREPROCESSING_FAILED  { background: #fed7e2; color: #c53030; }
    .badge-code-OCR_FAILED            { background: #fed7e2; color: #c53030; }
    .badge-code-OCR_LOW_CONFIDENCE    { background: #feebc8; color: #c05621; }
    .badge-code-OCR_EMPTY_RESULT      { background: #feebc8; color: #c05621; }
    .badge-code-PARSE_FAILED          { background: #e9d8fd; color: #6b46c1; }
    .badge-code-INCOMPLETE_RESULT     { background: #fefcbf; color: #975a16; }
    .badge-code-VIOLATION_CHECK_FAILED{ background: #fed7e2; color: #c53030; }
    .badge-code-UNKNOWN_ERROR         { background: hsl(var(--secondary)); color: hsl(var(--secondary-foreground)); }

    /* ── Pagination ── */
    .pagination {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
      padding: 14px 20px; border-top: 1px solid hsl(var(--border)); font-size: 13px;
    }
    .pagination-info { color: hsl(var(--muted-foreground)); }
    .pagination-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .page-btn {
      width: 32px; height: 32px; border-radius: calc(var(--radius) - 4px); border: 1px solid hsl(var(--border));
      background: hsl(var(--card)); font-size: 13px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: all .15s;
    }
    .page-btn:hover:not(:disabled) { border-color: hsl(var(--primary)); color: hsl(var(--primary)); }
    .page-btn.current { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border-color: hsl(var(--primary)); }
    .page-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Empty / Loading ── */
    .empty-state { text-align: center; padding: 60px 20px; color: hsl(var(--muted-foreground)); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }
    .loading { text-align: center; padding: 40px; color: hsl(var(--muted-foreground)); font-size: 14px; }
    .loading .spinner { display: inline-block; vertical-align: middle; margin-right: 8px; }

    /* ── Detail Modal (uses shared dialog-*; hidden until .open) ── */
    #modalOverlay.dialog-overlay { opacity: 0; pointer-events: none; transition: opacity .2s; }
    #modalOverlay.dialog-overlay.open { opacity: 1; pointer-events: all; }
    #modalOverlay .dialog-content { max-width: 720px; transform: translateY(20px); transition: transform .2s; }
    #modalOverlay.open .dialog-content { transform: none; }
    .detail-section { margin-bottom: 20px; }
    .detail-section h4 { font-size: 12px; font-weight: 700; color: hsl(var(--muted-foreground)); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
    .detail-grid { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; }
    @media (max-width: 480px) { .detail-grid { grid-template-columns: 1fr; } }
    .detail-key { color: hsl(var(--muted-foreground)); font-weight: 600; padding: 4px 0; }
    .detail-val { padding: 4px 0; word-break: break-all; }
    pre.stack {
      background: #1a202c; color: #e2e8f0; padding: 16px; border-radius: calc(var(--radius) - 2px);
      font-size: 11px; line-height: 1.6; overflow-x: auto; white-space: pre-wrap; word-break: break-all;
    }
    .context-box {
      background: hsl(var(--secondary)); border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) - 2px);
      padding: 14px; font-size: 12px; font-family: monospace; line-height: 1.7;
      overflow-x: auto; white-space: pre-wrap; word-break: break-all;
    }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px; left: 24px; max-width: 360px; margin-left: auto;
      background: hsl(222 20% 18%); color: white; padding: 10px 20px;
      border-radius: calc(var(--radius) - 2px); font-size: 13px; z-index: 2000;
      opacity: 0; transform: translateY(10px); transition: all .3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: none; }

    /* ── Auto-refresh indicator ── */
    .refresh-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: hsl(var(--success)); margin-right: 6px; vertical-align: middle;
      animation: pulse 1.5s ease-in-out infinite;
    }
  </style>
</head>
<body>

<!-- Page Toolbar -->
<div class="page-toolbar">
  <button class="btn btn-secondary" id="btnAutoRefresh" onclick="toggleAutoRefresh()">自動更新</button>
  <button class="btn btn-secondary" onclick="exportCSV()">匯出 CSV</button>
</div>

<div class="main">

  <!-- Stats Bar -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-card card"><div class="stat-label">今日錯誤總數</div><div class="stat-value" id="statTotal">—</div></div>
    <div class="stat-card card red"><div class="stat-label">硬錯誤（例外）</div><div class="stat-value" id="statHard">—</div></div>
    <div class="stat-card card yellow"><div class="stat-label">OCR 問題</div><div class="stat-value" id="statOcr">—</div></div>
    <div class="stat-card card orange"><div class="stat-label">結果不完整</div><div class="stat-value" id="statIncomplete">—</div></div>
    <div class="stat-card card green"><div class="stat-label">查詢的日期範圍</div><div class="stat-value" id="statDays" style="font-size:14px;padding-top:6px">—</div></div>
  </div>

  <!-- Filter Panel -->
  <div class="filter-panel card">
    <h3>篩選條件</h3>
    <div class="filter-grid">
      <div class="filter-group field">
        <label class="label">開始日期</label>
        <input type="date" id="fStartDate" class="input">
      </div>
      <div class="filter-group field">
        <label class="label">結束日期</label>
        <input type="date" id="fEndDate" class="input">
      </div>
      <div class="filter-group field">
        <label class="label">失敗步驟</label>
        <select id="fStep" class="select">
          <option value="">全部步驟</option>
          <option value="request_validation">request_validation（請求驗證）</option>
          <option value="image_download">image_download（圖片下載）</option>
          <option value="image_validation">image_validation（圖片驗證）</option>
          <option value="image_preprocessing">image_preprocessing（圖片預處理）</option>
          <option value="ocr_recognition">ocr_recognition（OCR 辨識）</option>
          <option value="data_parsing">data_parsing（資料解析）</option>
          <option value="result_validation">result_validation（結果驗證）</option>
          <option value="violation_check">violation_check（違規查詢）</option>
        </select>
      </div>
      <div class="filter-group field">
        <label class="label">錯誤代碼</label>
        <select id="fErrorCode" class="select">
          <option value="">全部代碼</option>
          <option value="VALIDATION_ERROR">VALIDATION_ERROR</option>
          <option value="DOWNLOAD_FAILED">DOWNLOAD_FAILED</option>
          <option value="INVALID_IMAGE">INVALID_IMAGE</option>
          <option value="PREPROCESSING_FAILED">PREPROCESSING_FAILED</option>
          <option value="OCR_FAILED">OCR_FAILED</option>
          <option value="OCR_LOW_CONFIDENCE">OCR_LOW_CONFIDENCE</option>
          <option value="OCR_EMPTY_RESULT">OCR_EMPTY_RESULT</option>
          <option value="PARSE_FAILED">PARSE_FAILED</option>
          <option value="INCOMPLETE_RESULT">INCOMPLETE_RESULT</option>
          <option value="VIOLATION_CHECK_FAILED">VIOLATION_CHECK_FAILED</option>
          <option value="UNKNOWN_ERROR">UNKNOWN_ERROR</option>
        </select>
      </div>
      <div class="filter-group field">
        <label class="label">API 端點</label>
        <select id="fEndpoint" class="select">
          <option value="">全部端點</option>
          <option value="/api/verify/url">/api/verify/url</option>
          <option value="/api/verify/upload">/api/verify/upload</option>
          <option value="/api/check-violation">/api/check-violation</option>
        </select>
      </div>
      <div class="filter-group field">
        <label class="label">Session ID</label>
        <input type="text" id="fSessionId" class="input" placeholder="貼上 sessionId...">
      </div>
      <div class="filter-group field" style="align-self:end">
        <div class="filter-actions">
          <button class="btn btn-primary" onclick="applyFilters()">查詢</button>
          <button class="btn btn-secondary" onclick="resetFilters()">清除</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Breakdown Charts -->
  <div class="breakdown-row" id="breakdownRow" style="display:none">
    <div class="breakdown-card card">
      <h3>依步驟分布</h3>
      <div id="byStep"></div>
    </div>
    <div class="breakdown-card card">
      <h3>依錯誤代碼分布</h3>
      <div id="byErrorCode"></div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-panel card">
    <div class="table-toolbar">
      <h3 id="tableTitle">錯誤紀錄</h3>
      <span class="table-meta" id="tableMeta"></span>
    </div>
    <div class="table-wrapper" style="border:none;border-radius:0;">
      <table id="errorTable" class="table table-stack">
        <thead>
          <tr>
            <th>時間</th>
            <th>步驟</th>
            <th>錯誤代碼</th>
            <th>訊息</th>
            <th>端點</th>
            <th>Session ID</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="6"><div class="loading"><span class="spinner"></span>載入中...</div></td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="paginationBar" style="display:none">
      <div class="pagination-info" id="paginationInfo"></div>
      <div class="pagination-btns" id="paginationBtns"></div>
    </div>
  </div>

</div>

<!-- Detail Modal -->
<div class="dialog-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="dialog-content">
    <div class="dialog-header">
      <h2 class="dialog-title">錯誤詳細資訊</h2>
      <button class="dialog-close" onclick="closeModalBtn()">✕</button>
    </div>
    <div class="dialog-body" id="modalBody"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const PAGE_SIZE = 50;
  let currentPage = 0;
  let totalRecords = 0;
  let currentFilters = {};
  let allRecords = [];
  let autoRefreshTimer = null;
  let isAutoRefresh = false;

  // ── Init ────────────────────────────────────────────────────────────────────
  (function init() {
    const today = todayStr();
    const p = new URLSearchParams(window.location.search);

    document.getElementById('fStartDate').value = p.get('startDate') || today;
    document.getElementById('fEndDate').value   = p.get('endDate')   || today;
    if (p.get('step'))      document.getElementById('fStep').value      = p.get('step');
    if (p.get('errorCode')) document.getElementById('fErrorCode').value = p.get('errorCode');
    if (p.get('endpoint'))  document.getElementById('fEndpoint').value  = p.get('endpoint');
    if (p.get('sessionId')) document.getElementById('fSessionId').value = p.get('sessionId');

    loadStats();
    loadErrors();
  })();

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  // ── Stats ────────────────────────────────────────────────────────────────────
  async function loadStats() {
    const start = document.getElementById('fStartDate').value || todayStr();
    const end   = document.getElementById('fEndDate').value   || todayStr();
    try {
      const r = await fetch(`/api/errors/stats?startDate=${start}&endDate=${end}`);
      const d = await r.json();
      if (!d.success) return;

      document.getElementById('statTotal').textContent = d.total;
      document.getElementById('statDays').textContent  = start === end ? start : `${start} ~ ${end}`;

      const hardCodes = ['DOWNLOAD_FAILED','INVALID_IMAGE','PREPROCESSING_FAILED','OCR_FAILED','PREPROCESSING_FAILED','PARSE_FAILED','VIOLATION_CHECK_FAILED','UNKNOWN_ERROR'];
      const ocrCodes  = ['OCR_FAILED','OCR_LOW_CONFIDENCE','OCR_EMPTY_RESULT'];
      let hard = 0, ocr = 0, incomplete = 0;
      for (const [code, cnt] of Object.entries(d.byErrorCode || {})) {
        if (hardCodes.includes(code)) hard += cnt;
        if (ocrCodes.includes(code))  ocr  += cnt;
        if (code === 'INCOMPLETE_RESULT') incomplete += cnt;
      }
      document.getElementById('statHard').textContent       = hard;
      document.getElementById('statOcr').textContent        = ocr;
      document.getElementById('statIncomplete').textContent = incomplete;

      renderBreakdown('byStep', d.byStep || {}, d.total);
      renderBreakdown('byErrorCode', d.byErrorCode || {}, d.total);
      document.getElementById('breakdownRow').style.display = d.total > 0 ? '' : 'none';
    } catch (e) {
      console.error(e);
    }
  }

  function renderBreakdown(containerId, data, total) {
    const el = document.getElementById(containerId);
    const sorted = Object.entries(data).sort((a, b) => b[1] - a[1]);
    if (!sorted.length) { el.innerHTML = '<div class="text-muted text-sm" style="padding:8px 0">（無資料）</div>'; return; }
    el.innerHTML = sorted.map(([label, cnt]) => {
      const pct = total ? Math.round(cnt / total * 100) : 0;
      return `
        <div class="breakdown-item">
          <span class="breakdown-label">${label}</span>
          <div class="breakdown-bar-wrap"><div class="breakdown-bar" style="width:${pct}%"></div></div>
          <span class="breakdown-count">${cnt}</span>
        </div>`;
    }).join('');
  }

  // ── Load Errors ──────────────────────────────────────────────────────────────
  async function loadErrors(page = 0) {
    currentPage = page;
    const params = buildParams(page);
    setTableLoading();

    try {
      const r = await fetch(`/api/errors?${params}`);
      const d = await r.json();
      if (!d.success) { showEmptyState('查詢失敗：' + d.error); return; }

      allRecords   = d.records || [];
      totalRecords = d.total   || 0;
      renderTable(allRecords);
      renderPagination(totalRecords, page);

      const from = page * PAGE_SIZE + 1;
      const to   = Math.min((page + 1) * PAGE_SIZE, totalRecords);
      document.getElementById('tableMeta').textContent =
        totalRecords > 0 ? `共 ${totalRecords} 筆，顯示第 ${from}–${to} 筆` : '';
    } catch(e) {
      showEmptyState('網路錯誤，無法取得資料');
      console.error(e);
    }
  }

  function buildParams(page) {
    const p = new URLSearchParams();
    const start = document.getElementById('fStartDate').value;
    const end   = document.getElementById('fEndDate').value;
    if (start) p.set('startDate', start);
    if (end)   p.set('endDate', end);
    const step      = document.getElementById('fStep').value;
    const errorCode = document.getElementById('fErrorCode').value;
    const endpoint  = document.getElementById('fEndpoint').value;
    const sessionId = document.getElementById('fSessionId').value.trim();
    if (step)      p.set('step', step);
    if (errorCode) p.set('errorCode', errorCode);
    if (endpoint)  p.set('endpoint', endpoint);
    if (sessionId) p.set('sessionId', sessionId);
    p.set('limit',  PAGE_SIZE);
    p.set('offset', page * PAGE_SIZE);
    return p.toString();
  }

  // ── Table Render ─────────────────────────────────────────────────────────────
  function setTableLoading() {
    document.getElementById('tableBody').innerHTML =
      `<tr><td colspan="6"><div class="loading"><span class="spinner"></span>載入中...</div></td></tr>`;
    document.getElementById('paginationBar').style.display = 'none';
  }

  function showEmptyState(msg = '此日期範圍內沒有錯誤紀錄') {
    document.getElementById('tableBody').innerHTML =
      `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">📋</div><p>${msg}</p></div></td></tr>`;
    document.getElementById('paginationBar').style.display = 'none';
  }

  function renderTable(records) {
    if (!records.length) { showEmptyState(); return; }

    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = records.map((r, i) => {
      const ts = formatTime(r.timestamp);
      const stepBadge = `<span class="badge badge-step-${r.step}">${r.step}</span>`;
      const codeBadge = `<span class="badge badge-code-${r.errorCode}">${r.errorCode}</span>`;
      const msg = escHtml(r.message || '');
      const ep  = escHtml(r.endpoint || '');
      const sid = r.sessionId ? r.sessionId.slice(0, 8) + '…' : '—';
      return `<tr onclick="openModal(${i})">
        <td class="td-time" data-label="時間">${ts}</td>
        <td data-label="步驟">${stepBadge}</td>
        <td data-label="錯誤代碼">${codeBadge}</td>
        <td class="td-msg" data-label="訊息" title="${msg}">${msg}</td>
        <td data-label="端點" class="text-xs text-muted">${ep}</td>
        <td class="td-session" data-label="Session ID" title="${r.sessionId || ''}">${sid}</td>
      </tr>`;
    }).join('');
  }

  // ── Pagination ───────────────────────────────────────────────────────────────
  function renderPagination(total, page) {
    const totalPages = Math.ceil(total / PAGE_SIZE);
    const bar  = document.getElementById('paginationBar');
    const info = document.getElementById('paginationInfo');
    const btns = document.getElementById('paginationBtns');

    if (totalPages <= 1) { bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    info.textContent = `第 ${page + 1} / ${totalPages} 頁`;

    let html = '';
    html += `<button class="page-btn" onclick="loadErrors(${page-1})" ${page===0?'disabled':''}>‹</button>`;
    const start = Math.max(0, page - 2);
    const end   = Math.min(totalPages - 1, page + 2);
    if (start > 0) html += `<button class="page-btn" onclick="loadErrors(0)">1</button>${start>1?'<span style="padding:0 4px;color:hsl(var(--muted-foreground))">…</span>':''}`;
    for (let i = start; i <= end; i++) {
      html += `<button class="page-btn${i===page?' current':''}" onclick="loadErrors(${i})">${i+1}</button>`;
    }
    if (end < totalPages - 1) html += `${end<totalPages-2?'<span style="padding:0 4px;color:hsl(var(--muted-foreground))">…</span>':''}<button class="page-btn" onclick="loadErrors(${totalPages-1})">${totalPages}</button>`;
    html += `<button class="page-btn" onclick="loadErrors(${page+1})" ${page===totalPages-1?'disabled':''}>›</button>`;
    btns.innerHTML = html;
  }

  // ── Filters ──────────────────────────────────────────────────────────────────
  function applyFilters() {
    loadStats();
    loadErrors(0);
  }

  function resetFilters() {
    document.getElementById('fStartDate').value = todayStr();
    document.getElementById('fEndDate').value   = todayStr();
    document.getElementById('fStep').value      = '';
    document.getElementById('fErrorCode').value = '';
    document.getElementById('fEndpoint').value  = '';
    document.getElementById('fSessionId').value = '';
    applyFilters();
  }

  // ── Auto Refresh ─────────────────────────────────────────────────────────────
  function toggleAutoRefresh() {
    isAutoRefresh = !isAutoRefresh;
    const btn = document.getElementById('btnAutoRefresh');
    if (isAutoRefresh) {
      btn.innerHTML = '<span class="refresh-dot"></span>更新中';
      btn.classList.remove('btn-secondary');
      btn.classList.add('btn-primary');
      autoRefreshTimer = setInterval(() => { loadStats(); loadErrors(currentPage); }, 10000);
      showToast('每 10 秒自動更新');
    } else {
      btn.textContent = '自動更新';
      btn.classList.remove('btn-primary');
      btn.classList.add('btn-secondary');
      clearInterval(autoRefreshTimer);
      showToast('已停止自動更新');
    }
  }

  // ── Modal ────────────────────────────────────────────────────────────────────
  function openModal(index) {
    const r = allRecords[index];
    if (!r) return;

    const body = document.getElementById('modalBody');
    body.innerHTML = `
      <div class="detail-section">
        <h4>基本資訊</h4>
        <div class="detail-grid">
          <span class="detail-key">時間</span>
          <span class="detail-val">${formatTime(r.timestamp)}</span>
          <span class="detail-key">Session ID</span>
          <span class="detail-val">${escHtml(r.sessionId || '—')}</span>
          <span class="detail-key">端點</span>
          <span class="detail-val">${escHtml(r.endpoint || '—')}</span>
          <span class="detail-key">步驟</span>
          <span class="detail-val"><span class="badge badge-step-${r.step}">${r.step}</span></span>
          <span class="detail-key">錯誤代碼</span>
          <span class="detail-val"><span class="badge badge-code-${r.errorCode}">${r.errorCode}</span></span>
          <span class="detail-key">訊息</span>
          <span class="detail-val">${escHtml(r.message || '—')}</span>
        </div>
      </div>

      ${r.context && Object.keys(r.context).length ? `
      <div class="detail-section">
        <h4>上下文</h4>
        <div class="context-box">${escHtml(JSON.stringify(r.context, null, 2))}</div>
      </div>` : ''}

      ${r.stack ? `
      <div class="detail-section">
        <h4>Stack Trace</h4>
        <pre class="stack">${escHtml(r.stack)}</pre>
      </div>` : ''}
    `;

    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModalBtn();
  }
  function closeModalBtn() {
    document.getElementById('modalOverlay').classList.remove('open');
  }

  // ── Export CSV ───────────────────────────────────────────────────────────────
  async function exportCSV() {
    const params = buildParams(0);
    try {
      // 取全部紀錄（limit 設大）
      const r = await fetch(`/api/errors?${params}&limit=9999&offset=0`);
      const d = await r.json();
      if (!d.success || !d.records.length) { showToast('沒有資料可匯出'); return; }

      const cols = ['timestamp','sessionId','endpoint','step','errorCode','message'];
      const lines = [cols.join(',')];
      for (const rec of d.records) {
        lines.push(cols.map(c => `"${String(rec[c]||'').replace(/"/g,'""')}"`).join(','));
      }

      const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `verification_errors_${todayStr()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast(`已匯出 ${d.records.length} 筆紀錄`);
    } catch(e) {
      showToast('匯出失敗');
    }
  }

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function formatTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} `
         + `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // Enter key on session ID field
  document.getElementById('fSessionId').addEventListener('keydown', e => {
    if (e.key === 'Enter') applyFilters();
  });
</script>
</body>
</html>
