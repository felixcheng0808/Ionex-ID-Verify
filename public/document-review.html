<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>證件審核系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 40px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-section {
            padding: 40px;
        }

        .env-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .env-btn {
            padding: 12px 30px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .env-btn.active {
            background: #667eea;
            color: white;
        }

        .env-btn:hover:not(.active) {
            background: #f0f2ff;
        }

        .login-form {
            max-width: 500px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .main-content {
            display: none;
        }

        .main-content.active {
            display: block;
        }

        .user-info {
            background: #f8f9ff;
            padding: 20px 40px;
            border-bottom: 2px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info-text {
            font-size: 14px;
            color: #666;
        }

        .user-info-text strong {
            color: #333;
        }

        .logout-btn {
            padding: 8px 20px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #667eea;
            color: white;
        }

        .content-area {
            padding: 40px;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            align-items: flex-end;
        }

        .refresh-btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            flex: 1;
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
        }

        .stat-card .label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .document-list {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .document-list table {
            width: 100%;
            border-collapse: collapse;
        }

        .document-list th {
            background: #f8f9ff;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }

        .document-list td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .document-list tr:hover {
            background: #fafbff;
        }

        .action-btn {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background: #d4edda;
            color: #155724;
        }

        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 650px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn-primary {
            background: #667eea;
            color: white;
        }

        .modal-btn-primary:hover {
            background: #5568d3;
        }

        .modal-btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .modal-btn-secondary:hover {
            background: #d0d0d0;
        }

        /* 手機響應式設計 */
        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .container {
                border-radius: 0;
                box-shadow: none;
                min-height: 100vh;
            }

            .header {
                padding: 20px 16px;
            }

            .header h1 {
                font-size: 20px;
            }

            .header p {
                font-size: 12px;
            }

            .login-section {
                padding: 24px 16px;
            }

            .env-switch {
                flex-direction: column;
            }

            .env-btn {
                width: 100%;
                padding: 14px 20px;
                font-size: 16px;
                min-height: 48px;
            }

            .user-info {
                flex-direction: column;
                gap: 10px;
                padding: 12px 16px;
                align-items: flex-start;
            }

            .user-info-text {
                font-size: 13px;
                width: 100%;
                word-break: break-all;
            }

            .logout-btn {
                width: 100%;
                padding: 12px;
                font-size: 15px;
                min-height: 44px;
            }

            .content-area {
                padding: 16px;
            }

            .controls {
                flex-direction: column;
            }

            .refresh-btn {
                width: 100%;
                padding: 14px;
                font-size: 16px;
                min-height: 48px;
            }

            .stats {
                flex-direction: column;
                gap: 10px;
            }

            .stat-card {
                text-align: center;
                padding: 15px;
            }

            /* 表格在手機上改為卡片式顯示 */
            .document-list {
                border: none;
                background: transparent;
            }

            .document-list table {
                display: block;
            }

            .document-list thead {
                display: none;
            }

            .document-list tbody {
                display: block;
            }

            .document-list tr {
                display: block;
                margin-bottom: 12px;
                border: 2px solid #e0e0e0;
                border-radius: 12px;
                padding: 16px;
                background: white;
            }

            .document-list tr:hover {
                background: #fafbff;
            }

            .document-list td {
                display: flex;
                align-items: flex-start;
                gap: 8px;
                padding: 6px 0;
                border: none;
                font-size: 14px;
                line-height: 1.5;
            }

            .document-list td:before {
                content: attr(data-label);
                font-weight: bold;
                color: #666;
                flex-shrink: 0;
                width: 72px;
                padding-top: 1px;
            }

            .action-btn {
                width: 100%;
                margin-top: 10px;
                padding: 14px 16px;
                font-size: 16px;
                min-height: 48px;
            }

            .loading {
                padding: 20px;
            }

            /* Modal - bottom sheet 樣式 */
            .modal {
                align-items: flex-end;
            }

            .modal-content {
                border-radius: 20px 20px 0 0;
                width: 100%;
                max-width: 100%;
                max-height: 88vh;
                padding: 24px 16px 36px;
            }

            .modal-header {
                font-size: 17px;
                margin-bottom: 16px;
            }

            .modal-footer {
                flex-direction: column;
                gap: 8px;
            }

            .modal-btn {
                width: 100%;
                padding: 14px;
                font-size: 16px;
                min-height: 48px;
            }

            /* 所有輸入框防止 iOS Safari 自動縮放 */
            input, select, textarea {
                font-size: 16px !important;
            }

            .login-btn {
                min-height: 52px;
                font-size: 17px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 18px;
            }

            .stat-card .value {
                font-size: 22px;
            }
        }

        /* Tab 切換樣式 */
        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 0;
            background: #f8f9ff;
        }

        .tab-btn {
            padding: 15px 30px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 16px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: -2px;
        }

        .tab-btn:hover {
            color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 查詢使用者區域 */
        .search-user-form {
            max-width: 600px;
            margin: 0 auto 30px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
        }

        .search-input-group {
            display: flex;
            gap: 10px;
        }

        .search-input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .search-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 使用者資訊卡片 */
        .user-result-card {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            overflow: hidden;
        }

        .user-result-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }

        .user-result-header h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
        }

        .user-result-body {
            padding: 20px;
        }

        .info-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            align-items: center;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            width: 120px;
            font-weight: bold;
            color: #666;
            flex-shrink: 0;
        }

        .info-value {
            flex: 1;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .copy-btn {
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            background: #5568d3;
        }

        .copy-btn.copied {
            background: #28a745;
        }

        .section-divider {
            margin: 20px 0;
            padding: 10px 0;
            border-top: 2px dashed #e0e0e0;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
        }

        .analyzing-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #fff3cd;
            color: #856404;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        /* 審核結果相關樣式 */
        .warn-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            background: #fff3cd;
            color: #856404;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .violation-result {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .violation-result.checking {
            background: #f8f9ff;
            color: #667eea;
            border: 2px solid #e0e8ff;
        }

        .violation-result.ok {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .violation-result.danger {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .violation-result.warning {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffeeba;
        }

        .violation-result.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .review-input {
            flex: 1;
            padding: 7px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
            min-width: 0;
        }

        .review-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .review-input.unrecognized {
            border-color: #ffc107;
            background: #fffdf0;
        }

        .manual-query-btn {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .manual-query-btn:hover {
            opacity: 0.9;
        }

        /* 手機響應式 Tab 與搜尋 */
        @media (max-width: 768px) {
            .tabs {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }

            .tabs::-webkit-scrollbar {
                display: none;
            }

            .tab-btn {
                padding: 14px 16px;
                font-size: 15px;
                flex: 1;
                text-align: center;
                white-space: nowrap;
                min-height: 48px;
            }

            .search-user-form {
                padding: 16px;
                margin-bottom: 12px;
            }

            .search-input-group {
                flex-direction: column;
            }

            .search-btn {
                width: 100%;
                padding: 14px;
                font-size: 16px;
                min-height: 48px;
            }

            .info-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
                padding: 10px 0;
            }

            .info-label {
                width: auto;
                font-size: 12px;
                color: #999;
            }

            .info-value {
                width: 100%;
                gap: 8px;
            }

            .copy-btn {
                padding: 8px 14px;
                font-size: 14px;
                min-height: 36px;
            }

            .user-result-body {
                padding: 16px;
            }

            .section-title {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🪪 證件審核系統</h1>
            <p>Ionex 身分證審核與自動填寫管理平台</p>
        </div>

        <!-- 登入區域 -->
        <div class="login-section" id="loginSection">
            <div class="env-switch">
                <button class="env-btn active" data-env="alpha">Alpha 環境</button>
                <button class="env-btn" data-env="prod">Prod 環境</button>
            </div>

            <form class="login-form" id="loginForm" autocomplete="on">
                <div id="loginError"></div>

                <div class="form-group">
                    <label for="emailInput">帳號 (Email)</label>
                    <input type="email" id="emailInput" name="email" placeholder="請輸入帳號" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="passwordInput">密碼</label>
                    <input type="password" id="passwordInput" name="password" placeholder="請輸入密碼" required autocomplete="current-password">
                </div>

                <button type="submit" class="login-btn" id="loginBtn">登入</button>
            </form>
        </div>

        <!-- 主要內容區域 -->
        <div class="main-content" id="mainContent">
            <div class="user-info">
                <div class="user-info-text">
                    <strong>環境:</strong> <span id="currentEnv">Alpha</span> |
                    <strong>使用者:</strong> <span id="currentUser">-</span>
                </div>
                <button class="logout-btn" id="logoutBtn">登出</button>
            </div>

            <!-- Tab 切換按鈕 -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="review">證件審核</button>
                <button class="tab-btn" data-tab="search">查詢使用者</button>
            </div>

            <!-- 證件審核 Tab 內容 -->
            <div class="tab-content active" id="tab-review">
                <div class="content-area">
                    <div class="controls">
                        <button class="refresh-btn" id="refreshBtn">🔄 重新整理</button>
                    </div>

                    <div class="stats">
                        <div class="stat-card">
                            <div class="label">待審核證件</div>
                            <div class="value" id="totalCount">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="label">已載入</div>
                            <div class="value" id="loadedCount">0</div>
                        </div>
                    </div>

                    <div id="messageArea"></div>

                    <div class="document-list">
                        <table>
                            <thead>
                                <tr>
                                    <th>使用者名稱</th>
                                    <th>Email</th>
                                    <th>手機</th>
                                    <th>上傳時間</th>
                                    <th>證件狀態</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="documentTableBody">
                                <tr>
                                    <td colspan="6" class="loading">
                                        <div class="spinner"></div>
                                        載入中...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 查詢使用者 Tab 內容 -->
            <div class="tab-content" id="tab-search">
                <div class="content-area">
                    <div class="search-user-form">
                        <label style="display: block; margin-bottom: 10px; font-weight: bold; color: #333;">輸入使用者 ID</label>
                        <div class="search-input-group">
                            <input type="text" id="userIdInput" name="userIdInput_noautofill" placeholder="請輸入 userId" autocomplete="off" data-lpignore="true" data-form-type="other">
                            <button class="search-btn" id="searchUserBtn">🔍 查詢</button>
                        </div>
                    </div>

                    <div class="search-user-form" style="margin-top: 12px;">
                        <label style="display: block; margin-bottom: 10px; font-weight: bold; color: #333;">依名稱查詢</label>
                        <div class="search-input-group">
                            <input type="text" id="displayNameInput" name="displayNameInput_noautofill" placeholder="請輸入使用者名稱" autocomplete="off" data-lpignore="true" data-form-type="other">
                            <button class="search-btn" id="searchByNameBtn">🔍 名稱查詢</button>
                        </div>
                    </div>

                    <div id="searchMessageArea"></div>

                    <!-- 名稱查詢結果列表 -->
                    <div id="nameSearchResultArea"></div>

                    <!-- 查詢結果區域 -->
                    <div id="searchResultArea"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 證件詳情 Modal -->
    <div class="modal" id="documentModal">
        <div class="modal-content">
            <div class="modal-header">證件詳情</div>
            <div class="modal-body" id="modalBody">
                <!-- 內容由 JS 動態生成 -->
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-secondary" onclick="closeModal()">關閉</button>
            </div>
        </div>
    </div>

    <script>
        // 環境配置
        const ENV_CONFIG = {
            alpha: {
                name: 'Alpha',
                apiKey: 'eab583fa-7d80-fc53-a2f3-a331f2175f87',
                authUrl: 'https://nex-alpha.ionexenergy.com/api/v2/user/auth',
                graphqlUrl: 'https://nex-alpha.ionexenergy.com/pjUq6av7ll-ionexGraphQL'
            },
            prod: {
                name: 'Prod',
                apiKey: '20bed7cc-35d2-4f42-bff6-49eb8f5bfd6d',
                authUrl: 'https://nex.ionexenergy.com/api/v2/user/auth',
                graphqlUrl: 'https://nex-console.ionexenergy.com/d5eGQDwmbwYuWEdWfUZt-ionex'
            }
        };

        // 全域狀態
        let currentEnv = 'alpha';
        let authToken = null;
        let userEmail = null;
        let documentList = [];
        let currentSearchUserId = null;  // 當前查詢的使用者 ID
        let currentSearchUserData = null; // 當前查詢的使用者資料

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initEventListeners();
            checkSavedSession();
        });

        function initEventListeners() {
            // 環境切換
            document.querySelectorAll('.env-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.env-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentEnv = this.dataset.env;
                });
            });

            // 登入 (使用 form submit 以支援瀏覽器記憶密碼)
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                handleLogin();
            });

            // 登出
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);

            // 重新整理
            document.getElementById('refreshBtn').addEventListener('click', loadDocuments);

            // Tab 切換
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const tabId = this.dataset.tab;
                    switchTab(tabId);
                });
            });

            // 查詢使用者
            document.getElementById('searchUserBtn').addEventListener('click', searchUser);
            document.getElementById('userIdInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchUser();
            });

            // 名稱查詢
            document.getElementById('searchByNameBtn').addEventListener('click', searchUserByName);
            document.getElementById('displayNameInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchUserByName();
            });
        }

        // Tab 切換功能
        function switchTab(tabId) {
            // 更新 Tab 按鈕狀態
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.tab === tabId) {
                    btn.classList.add('active');
                }
            });

            // 更新 Tab 內容顯示
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        // 查詢使用者功能 (by userId input)
        async function searchUser() {
            const userId = document.getElementById('userIdInput').value.trim();
            if (!userId) {
                showSearchError('請輸入使用者 ID');
                return;
            }
            const searchBtn = document.getElementById('searchUserBtn');
            searchBtn.disabled = true;
            searchBtn.textContent = '查詢中...';
            try {
                await searchUserById(userId);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = '🔍 查詢';
            }
        }

        // 依 userId 查詢使用者（核心邏輯）
        async function searchUserById(userId) {
            const resultArea = document.getElementById('searchResultArea');
            const messageArea = document.getElementById('searchMessageArea');

            messageArea.innerHTML = '';
            resultArea.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    正在查詢使用者資料...
                </div>
            `;

            try {
                const config = ENV_CONFIG[currentEnv];

                const response = await fetch(config.graphqlUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`,
                        'x-api-key': config.apiKey
                    },
                    body: JSON.stringify({
                        query: `query RentalUserDetail($filter: RentalUsersFilter!, $orderBy: [UsersOrder!]!) {
                            RentalUsersQuery {
                                rentalUsers(filter: $filter, orderBy: $orderBy) {
                                    edges {
                                        node {
                                            userId
                                            displayName
                                            email
                                            phone
                                            rentalCertificates {
                                                certificateType
                                                status
                                                expiredAt
                                                url
                                            }
                                        }
                                    }
                                }
                            }
                        }`,
                        variables: {
                            filter: {
                                organization: 'KYMCO_TW',
                                userId: userId
                            },
                            orderBy: [{ direction: 'DESC', field: 'USER_ID' }]
                        }
                    })
                });

                const result = await response.json();

                if (result.errors) {
                    throw new Error(result.errors[0].message);
                }

                const users = result.data.RentalUsersQuery.rentalUsers.edges;

                if (users.length === 0) {
                    resultArea.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🔍</div>
                            <div>找不到此使用者</div>
                        </div>
                    `;
                    return;
                }

                const user = users[0].node;

                currentSearchUserId = user.userId;
                currentSearchUserData = {
                    userId: user.userId,
                    displayName: user.displayName || '',
                    email: user.email || ''
                };

                const idCardFront = user.rentalCertificates?.find(
                    cert => cert.certificateType === 'ID_CARD_FRONT'
                );

                renderUserResult(user, idCardFront);

            } catch (error) {
                console.error('查詢使用者錯誤:', error);
                showSearchError('查詢失敗: ' + error.message);
                resultArea.innerHTML = '';
            }
        }

        // 依名稱查詢使用者
        async function searchUserByName() {
            const displayName = document.getElementById('displayNameInput').value.trim();
            const searchBtn = document.getElementById('searchByNameBtn');
            const nameResultArea = document.getElementById('nameSearchResultArea');
            const messageArea = document.getElementById('searchMessageArea');

            if (!displayName) {
                showSearchError('請輸入使用者名稱');
                return;
            }

            searchBtn.disabled = true;
            searchBtn.textContent = '查詢中...';
            messageArea.innerHTML = '';
            nameResultArea.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    正在搜尋使用者...
                </div>
            `;
            document.getElementById('searchResultArea').innerHTML = '';

            try {
                const config = ENV_CONFIG[currentEnv];

                const response = await fetch(config.graphqlUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`,
                        'x-api-key': config.apiKey
                    },
                    body: JSON.stringify({
                        operationName: 'TableRentalUsers',
                        query: `query TableRentalUsers($filter: RentalUsersFilter!, $orderBy: [UsersOrder!]!, $size: Int, $skip: Int) {
                            RentalUsersQuery {
                                rentalUsers(filter: $filter, orderBy: $orderBy, size: $size, skip: $skip) {
                                    edges {
                                        node {
                                            userId
                                            displayName
                                            email
                                            phone
                                        }
                                    }
                                    totalCount
                                }
                            }
                        }`,
                        variables: {
                            filter: {
                                displayName: displayName,
                                organization: 'KYMCO_TW'
                            },
                            size: 25,
                            skip: 0,
                            orderBy: [{ direction: 'DESC', field: 'USER_ID' }]
                        }
                    })
                });

                const result = await response.json();

                if (result.errors) {
                    throw new Error(result.errors[0].message);
                }

                const users = result.data.RentalUsersQuery.rentalUsers.edges;
                const totalCount = result.data.RentalUsersQuery.rentalUsers.totalCount;

                if (users.length === 0) {
                    nameResultArea.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🔍</div>
                            <div>找不到符合名稱的使用者</div>
                        </div>
                    `;
                    return;
                }

                const rows = users.map(({ node: u }) => `
                    <tr style="cursor: pointer;" onclick="selectNameSearchUser('${u.userId}', this)">
                        <td>${u.displayName || '-'}</td>
                        <td>${u.email || '-'}</td>
                        <td>${u.phone || '-'}</td>
                        <td>${u.userId}</td>
                    </tr>
                `).join('');

                nameResultArea.innerHTML = `
                    <div style="margin: 16px 0 8px; font-size: 13px; color: #666;">
                        共找到 ${totalCount} 位使用者，顯示前 ${users.length} 筆。點擊列表可查看詳細資料。
                    </div>
                    <div style="overflow-x: auto;">
                        <table style="width:100%; border-collapse: collapse; font-size: 14px;">
                            <thead>
                                <tr style="background: #f5f5f5;">
                                    <th style="padding: 8px 12px; text-align: left; border-bottom: 2px solid #ddd;">名稱</th>
                                    <th style="padding: 8px 12px; text-align: left; border-bottom: 2px solid #ddd;">Email</th>
                                    <th style="padding: 8px 12px; text-align: left; border-bottom: 2px solid #ddd;">手機</th>
                                    <th style="padding: 8px 12px; text-align: left; border-bottom: 2px solid #ddd;">User ID</th>
                                </tr>
                            </thead>
                            <tbody id="nameSearchTableBody">
                                ${rows}
                            </tbody>
                        </table>
                    </div>
                `;

                // 套用 hover 樣式
                nameResultArea.querySelectorAll('tbody tr').forEach(tr => {
                    tr.addEventListener('mouseenter', () => tr.style.background = '#f0f7ff');
                    tr.addEventListener('mouseleave', () => {
                        tr.style.background = tr.classList.contains('selected') ? '#dbeafe' : '';
                    });
                });

            } catch (error) {
                console.error('名稱查詢錯誤:', error);
                showSearchError('查詢失敗: ' + error.message);
                nameResultArea.innerHTML = '';
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = '🔍 名稱查詢';
            }
        }

        // 從名稱查詢結果選取使用者
        async function selectNameSearchUser(userId, row) {
            // 標示已選取列
            document.querySelectorAll('#nameSearchTableBody tr').forEach(tr => {
                tr.classList.remove('selected');
                tr.style.background = '';
            });
            row.classList.add('selected');
            row.style.background = '#dbeafe';

            // 填入 userId 輸入框並查詢詳細資料
            document.getElementById('userIdInput').value = userId;
            document.getElementById('searchResultArea').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            await searchUserById(userId);
        }

        // 渲染使用者結果
        async function renderUserResult(user, idCardFront) {
            const resultArea = document.getElementById('searchResultArea');

            let idCardAnalysisHtml = '';
            if (idCardFront && idCardFront.url) {
                idCardAnalysisHtml = `
                    <div class="section-divider"></div>
                    <div class="section-title">身分證圖片</div>
                    <div style="text-align: center; margin-bottom: 20px;">
                        <img src="${idCardFront.url}" alt="身分證正面"
                             style="max-width: 100%; max-height: 300px; border-radius: 8px; border: 2px solid #e0e0e0; cursor: pointer;"
                             onclick="window.open('${idCardFront.url}', '_blank')"
                             title="點擊放大檢視">
                        <div style="font-size: 12px; color: #666; margin-top: 5px;">點擊圖片可放大檢視</div>
                    </div>
                    <div class="section-title">證件分析結果</div>
                    <div id="idCardAnalysisResult">
                        <div class="loading" style="padding: 20px;">
                            <div class="spinner"></div>
                            正在分析身分證圖片...
                        </div>
                    </div>
                `;
            } else {
                idCardAnalysisHtml = `
                    <div class="section-divider"></div>
                    <div class="section-title">證件分析結果</div>
                    <div style="color: #999; padding: 20px; text-align: center;">
                        此使用者尚未上傳身分證正面圖片
                    </div>
                `;
            }

            resultArea.innerHTML = `
                <div class="user-result-card">
                    <div class="user-result-header">
                        <h3>使用者資訊</h3>
                        <div style="font-size: 12px; opacity: 0.8;">User ID: ${user.userId}</div>
                    </div>
                    <div class="user-result-body">
                        <div class="section-title">基本資料</div>
                        <div class="info-row">
                            <div class="info-label">顯示名稱</div>
                            <div class="info-value">${user.displayName || '-'}</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">Email</div>
                            <div class="info-value">${user.email || '-'}</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">手機號碼</div>
                            <div class="info-value">${user.phone || '-'}</div>
                        </div>
                        ${idCardAnalysisHtml}
                    </div>
                </div>
            `;

            // 如果有身分證圖片，開始分析（傳入 displayName 輔助）
            if (idCardFront && idCardFront.url) {
                await analyzeIdCard(idCardFront.url, user.displayName);
            }
        }

        // 分析身分證
        async function analyzeIdCard(imageUrl, displayName = null) {
            const analysisResultEl = document.getElementById('idCardAnalysisResult');

            try {
                const response = await fetch('/api/verify/url', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        imageUrl: imageUrl,
                        documentType: 'id_card',  // 強制使用身分證解析器
                        displayName: displayName  // 輔助姓名辨識（格式可能是名+姓）
                    })
                });

                const result = await response.json();

                // 只要有 data 物件就嘗試顯示結果（即使 success 為 false）
                const name = result.data?.name || '';
                const idNumber = result.data?.idNumber || '';

                analysisResultEl.innerHTML = `
                    <div class="info-row">
                        <div class="info-label">姓名</div>
                        <div class="info-value">
                            <input type="text" id="edit-idName" value="${name}" placeholder="請輸入姓名" style="flex:1; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                            ${name ? `<button class="copy-btn" onclick="copyToClipboard(document.getElementById('edit-idName').value, this)">複製</button>` : ''}
                        </div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">身分證字號</div>
                        <div class="info-value">
                            <input type="text" id="edit-idNumber" value="${idNumber}" placeholder="請輸入身分證字號" style="flex:1; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                            ${idNumber ? `<button class="copy-btn" onclick="copyToClipboard(document.getElementById('edit-idNumber').value, this)">複製</button>` : ''}
                        </div>
                    </div>
                    <div style="margin-top: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                        <label style="display: flex; align-items: center; gap: 5px; font-size: 14px; cursor: pointer;">
                            <input type="checkbox" id="isRentalUser" style="width: 16px; height: 16px; cursor: pointer;">
                            僅為租賃使用者
                        </label>
                        <button class="action-btn" onclick="saveUserIdData()" style="background: #28a745;">
                            💾 儲存到 JSON
                        </button>
                        <span id="save-status" style="font-size: 12px; color: #666;"></span>
                    </div>
                    ${result.confidence ? `
                        <div style="margin-top: 10px; font-size: 12px; color: #666;">
                            辨識信心度: ${Math.round(result.confidence * 100)}%
                            ${!result.success ? ' (部分辨識)' : ''}
                        </div>
                    ` : ''}
                `;
            } catch (error) {
                console.error('證件分析錯誤:', error);
                analysisResultEl.innerHTML = `
                    <div style="color: #dc3545; padding: 10px;">
                        證件分析發生錯誤: ${error.message}
                    </div>
                `;
            }
        }

        // 複製到剪貼簿
        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.textContent;
                btn.textContent = '已複製';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 1500);
            }).catch(err => {
                console.error('複製失敗:', err);
                alert('複製失敗，請手動複製');
            });
        }

        // 儲存使用者 ID 資料到 verify_user.json
        async function saveUserIdData() {
            if (!currentSearchUserId || !currentSearchUserData) {
                alert('請先查詢使用者');
                return;
            }

            const idName = document.getElementById('edit-idName')?.value?.trim() || '';
            const idNumber = document.getElementById('edit-idNumber')?.value?.trim() || '';
            const isRentalUser = document.getElementById('isRentalUser')?.checked || false;
            const statusEl = document.getElementById('save-status');

            // 如果只勾選租賃使用者，不需要填寫姓名和身分證
            if (!isRentalUser && !idName && !idNumber) {
                statusEl.textContent = '請至少填寫一個欄位';
                statusEl.style.color = '#dc3545';
                return;
            }

            statusEl.textContent = '儲存中...';
            statusEl.style.color = '#666';

            try {
                let messages = [];

                // 如果有填寫姓名或身分證，儲存到 verify_user.json
                if (idName || idNumber) {
                    const response = await fetch('/api/verify-user/update', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            userId: currentSearchUserId,
                            displayName: currentSearchUserData.displayName,
                            email: currentSearchUserData.email,
                            idName: idName || null,
                            idNumber: idNumber || null
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        messages.push(result.isNewUser ? '驗證資料新增成功' : '驗證資料更新成功');
                    } else {
                        throw new Error(result.error || '驗證資料儲存失敗');
                    }
                }

                // 如果勾選租賃使用者，儲存到 rental_user.json
                if (isRentalUser) {
                    const rentalResponse = await fetch('/api/rental-user/add', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            userId: currentSearchUserId,
                            email: currentSearchUserData.email
                        })
                    });

                    const rentalResult = await rentalResponse.json();

                    if (rentalResult.success) {
                        messages.push(rentalResult.isNew ? '租賃使用者新增成功' : '租賃使用者已存在');
                    } else {
                        throw new Error(rentalResult.error || '租賃使用者儲存失敗');
                    }
                }

                statusEl.textContent = '✓ ' + messages.join(', ');
                statusEl.style.color = '#28a745';
            } catch (error) {
                console.error('儲存失敗:', error);
                statusEl.textContent = '✗ ' + error.message;
                statusEl.style.color = '#dc3545';
            }
        }

        // 顯示查詢錯誤訊息
        function showSearchError(message) {
            const area = document.getElementById('searchMessageArea');
            area.innerHTML = `<div class="error-message">❌ ${message}</div>`;
            setTimeout(() => {
                area.innerHTML = '';
            }, 5000);
        }

        function checkSavedSession() {
            const saved = localStorage.getItem('ionex_session');
            if (saved) {
                try {
                    const session = JSON.parse(saved);
                    if (session.token && session.email && session.env) {
                        currentEnv = session.env;
                        authToken = session.token;
                        userEmail = session.email;
                        showMainContent();
                        loadDocuments();
                    }
                } catch (e) {
                    console.error('Failed to restore session:', e);
                }
            }
        }

        async function handleLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            if (!email || !password) {
                showError('請輸入帳號和密碼');
                return;
            }

            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.textContent = '登入中...';

            try {
                const config = ENV_CONFIG[currentEnv];
                const response = await fetch(config.authUrl, {
                    method: 'POST',
                    headers: {
                        'scope': 'knex',
                        'Content-Type': 'application/json',
                        'x-api-key': config.apiKey
                    },
                    body: JSON.stringify({
                        asp: 'ep',
                        email: email,
                        password: password,
                        deviceId: 'testDeviceIdH'
                    })
                });

                const data = await response.json();

                if (response.ok && data.tokenInfo && data.tokenInfo.token) {
                    authToken = data.tokenInfo.token;
                    userEmail = email;

                    // 儲存 session
                    localStorage.setItem('ionex_session', JSON.stringify({
                        token: authToken,
                        email: userEmail,
                        env: currentEnv
                    }));

                    showMainContent();
                    loadDocuments();
                } else {
                    showError(data.message || '登入失敗，請檢查帳號密碼');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('登入失敗: ' + error.message);
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登入';
            }
        }

        function handleLogout() {
            authToken = null;
            userEmail = null;
            localStorage.removeItem('ionex_session');
            hideMainContent();
            document.getElementById('emailInput').value = '';
            document.getElementById('passwordInput').value = '';
        }

        function showMainContent() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('mainContent').classList.add('active');
            document.getElementById('currentEnv').textContent = ENV_CONFIG[currentEnv].name;
            document.getElementById('currentUser').textContent = userEmail;
        }

        function hideMainContent() {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('mainContent').classList.remove('active');
        }

        async function loadDocuments() {
            const config = ENV_CONFIG[currentEnv];
            const tableBody = document.getElementById('documentTableBody');
            tableBody.innerHTML = '<tr><td colspan="6" class="loading"><div class="spinner"></div>載入中...</td></tr>';

            try {
                const response = await fetch(config.graphqlUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`,
                        'x-api-key': config.apiKey
                    },
                    body: JSON.stringify({
                        operationName: 'TableDocumentReview',
                        variables: {
                            filter: { organization: 'KYMCO_TW' },
                            size: 25,
                            skip: 0,
                            orderBy: [{ direction: 'ASC', field: 'CERTIFICATE_LAST_UPLOAD_AT' }]
                        },
                        query: `query TableDocumentReview($orderBy: [ReviewsOrder!]!, $filter: RentalReviewsFilter, $size: Int, $skip: Int) {
                            RentalReviewsQuery {
                                rentalReviews(orderBy: $orderBy, filter: $filter, size: $size, skip: $skip) {
                                    edges {
                                        node {
                                            userId
                                            organization
                                            displayName
                                            email
                                            phone
                                            certificateLastUploadAt
                                            rentalCertificates {
                                                certificateType
                                                status
                                                invalidReason
                                                url
                                                uploadAt
                                                expiredAt
                                            }
                                        }
                                    }
                                    pageInfo {
                                        endCursor
                                        hasNextPage
                                    }
                                    totalCount
                                }
                            }
                        }`
                    })
                });

                const result = await response.json();

                if (result.errors) {
                    throw new Error(result.errors[0].message);
                }

                const reviews = result.data.RentalReviewsQuery.rentalReviews;
                documentList = reviews.edges.map(edge => edge.node);

                document.getElementById('totalCount').textContent = reviews.totalCount;
                document.getElementById('loadedCount').textContent = documentList.length;

                renderDocumentList();
                showSuccess(`成功載入 ${documentList.length} 筆資料`);

            } catch (error) {
                console.error('Load documents error:', error);
                showError('載入失敗: ' + error.message);
                tableBody.innerHTML = '<tr><td colspan="6" class="error-message">載入失敗，請重試</td></tr>';
            }
        }

        function renderDocumentList() {
            const tableBody = document.getElementById('documentTableBody');

            if (documentList.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <div>目前沒有待審核的證件</div>
                        </td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = documentList.map((doc, index) => {
                const idCardFront = doc.rentalCertificates.find(cert => cert.certificateType === 'ID_CARD_FRONT');
                const statusBadge = getStatusBadge(idCardFront?.status);
                const uploadTime = formatDate(doc.certificateLastUploadAt);

                return `
                    <tr>
                        <td data-label="使用者名稱:">${doc.displayName || '-'}</td>
                        <td data-label="Email:">${doc.email || '-'}</td>
                        <td data-label="手機:">${doc.phone || '-'}</td>
                        <td data-label="上傳時間:">${uploadTime}</td>
                        <td data-label="證件狀態:">${statusBadge}</td>
                        <td data-label="操作:">
                            <button class="action-btn" onclick="reviewDocument(${index})">
                                🔍 審核證件
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function getStatusBadge(status) {
            switch (status) {
                case 'PENDING':
                    return '<span class="status-badge status-pending">待審核</span>';
                case 'APPROVED':
                    return '<span class="status-badge status-approved">已通過</span>';
                case 'REJECTED':
                    return '<span class="status-badge status-rejected">已拒絕</span>';
                default:
                    return '<span class="status-badge">未知</span>';
            }
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleString('zh-TW', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatBirthDate(dateStr) {
            if (!dateStr) return '';
            const match = dateStr.match(/(\d{2,3})年(\d{1,2})月(\d{1,2})日/);
            if (!match) return dateStr;
            const year  = match[1].padStart(3, '0');
            const month = match[2].padStart(2, '0');
            const day   = match[3].padStart(2, '0');
            return `${year}${month}${day}`;
        }

        const VALID_LICENSE_TYPES = ['普通重型機車', '大型重型機車'];

        function isValidLicenseType(licenseType) {
            if (!licenseType) return false;
            return VALID_LICENSE_TYPES.some(t => licenseType.includes(t));
        }

        async function reviewDocument(index) {
            const doc = documentList[index];
            const idCardFront = doc.rentalCertificates.find(cert => cert.certificateType === 'ID_CARD_FRONT');
            const drivingLicense = doc.rentalCertificates.find(cert => cert.certificateType === 'DRIVING_LICENSE_FRONT');

            if (!idCardFront || !idCardFront.url) {
                showError('找不到身分證正面圖片');
                return;
            }

            document.querySelector('#documentModal .modal-header').textContent = `🔍 審核證件 — ${doc.displayName || ''}`;
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div style="text-align:center; padding:30px; color:#666;">
                    <div class="spinner" style="margin:0 auto 15px;"></div>
                    <p>正在辨識證件，請稍候...</p>
                </div>`;
            document.getElementById('documentModal').classList.add('active');

            try {
                const [idResult, licenseResult] = await Promise.all([
                    fetch('/api/verify/url', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ imageUrl: idCardFront.url, documentType: 'id_card', displayName: doc.displayName })
                    }).then(r => r.json()),
                    (drivingLicense?.url)
                        ? fetch('/api/verify/url', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ imageUrl: drivingLicense.url })
                        }).then(r => r.json())
                        : Promise.resolve(null)
                ]);

                const idNumber    = idResult.data?.idNumber || licenseResult?.data?.idNumber || '';
                const birthDate   = formatBirthDate(idResult.data?.birthDate || '');
                const licenseType = licenseResult?.data?.licenseType || '';
                const issueDate   = licenseResult?.data?.issueDate   || '';
                const idFromLicense = !idResult.data?.idNumber && !!licenseResult?.data?.idNumber;
                const hasLicense  = !!drivingLicense?.url;
                const validType   = isValidLicenseType(licenseType);

                // 可編輯欄位列（無值時加 unrecognized 樣式）
                const makeEditRow = (label, inputId, value, hint = '') => `
                    <div class="info-row">
                        <div class="info-label">${label}</div>
                        <div class="info-value">
                            <input class="review-input${value ? '' : ' unrecognized'}"
                                   id="${inputId}" value="${value}"
                                   placeholder="${value ? '' : '無法辨識，請手動輸入'}">
                            ${value ? `<button class="copy-btn" onclick="copyToClipboard(document.getElementById('${inputId}').value, this)">複製</button>` : ''}
                            ${hint ? `<span class="warn-badge">${hint}</span>` : ''}
                            ${!value ? `<span class="warn-badge">⚠️ 無法辨識</span>` : ''}
                        </div>
                    </div>`;

                // 唯讀欄位列
                const makeReadRow = (label, value, badge = '') => `
                    <div class="info-row">
                        <div class="info-label">${label}</div>
                        <div class="info-value">
                            <span>${value || '-'}</span>
                            ${badge}
                        </div>
                    </div>`;

                // 駕照種類 badge
                let licenseTypeBadge = '';
                if (!hasLicense) {
                    licenseTypeBadge = `<span class="warn-badge">⚠️ 未提供駕照</span>`;
                } else if (!licenseType) {
                    licenseTypeBadge = `<span class="warn-badge">⚠️ 無法辨識</span>`;
                } else if (!validType) {
                    licenseTypeBadge = `<span class="warn-badge">⚠️ 不支援此種類</span>`;
                }

                modalBody.innerHTML = `
                    <div style="text-align:center; margin-bottom:20px;">
                        <img src="${idCardFront.url}" alt="身分證照片"
                             style="max-width:100%; max-height:220px; border-radius:8px; border:2px solid #e0e0e0; cursor:pointer;"
                             onclick="window.open('${idCardFront.url}', '_blank')"
                             title="點擊放大檢視">
                        <div style="font-size:12px; color:#666; margin-top:4px;">點擊圖片可放大</div>
                    </div>
                    ${makeEditRow('身分證字號', 'r-idNumber', idNumber, idFromLicense ? '來自駕照' : '')}
                    ${makeEditRow('出生年月日', 'r-birthDate', birthDate, '')}
                    ${makeReadRow('發照日期', issueDate)}
                    ${makeReadRow('駕照種類', licenseType, licenseTypeBadge)}
                    <div id="r-violation"></div>`;

                // 觸發違規查詢
                runViolationCheck(idNumber, birthDate, hasLicense, validType, licenseType);

            } catch (error) {
                modalBody.innerHTML = `
                    <div style="color:#dc3545; padding:20px; text-align:center;">
                        ⚠️ 辨識失敗: ${error.message}
                    </div>`;
            }
        }

        async function runViolationCheck(idNumber, birthDate, hasLicense, validType, licenseType) {
            const el = document.getElementById('r-violation');
            if (!el) return;

            // 例外：無駕照
            if (!hasLicense) {
                el.innerHTML = `<div class="violation-result warning">⚠️ 未提供駕照，無法查詢違規記錄</div>`;
                return;
            }

            // 例外：駕照種類不支援
            if (!validType) {
                const typeText = licenseType ? `（${licenseType}）` : '';
                el.innerHTML = `
                    <div class="violation-result warning">⚠️ 駕照種類${typeText}不支援自動查詢，僅限普通重型機車、大型重型機車</div>`;
                return;
            }

            // 例外：缺少必要欄位
            const curId    = document.getElementById('r-idNumber')?.value?.trim()  || idNumber;
            const curBirth = document.getElementById('r-birthDate')?.value?.trim() || birthDate;

            if (!curId || !curBirth) {
                el.innerHTML = `
                    <div class="violation-result warning">❓ 無法自動查詢，請補齊身分證字號與出生日期</div>
                    <button class="manual-query-btn" onclick="manualViolationCheck()">🔍 手動查詢違規記錄</button>`;
                return;
            }

            // 查詢中
            el.innerHTML = `
                <div class="violation-result checking">
                    <div class="spinner" style="width:20px;height:20px;border-width:3px;margin:0;flex-shrink:0;"></div>
                    查詢違規記錄中...
                </div>`;

            try {
                const result = await fetch('/api/check-violation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idNumber: curId, birthDate: curBirth })
                }).then(r => r.json());

                if (result.success) {
                    el.innerHTML = result.hasViolation
                        ? `<div class="violation-result danger">⚠️ 有駕照違規記錄，請謹慎評估</div>`
                        : `<div class="violation-result ok">✅ 查無駕照違規記錄</div>`;
                } else {
                    el.innerHTML = `
                        <div class="violation-result error">❌ 查詢失敗：${result.error}</div>
                        <button class="manual-query-btn" onclick="manualViolationCheck()">🔄 重新查詢</button>`;
                }
            } catch (err) {
                el.innerHTML = `
                    <div class="violation-result error">❌ 查詢失敗：${err.message}</div>
                    <button class="manual-query-btn" onclick="manualViolationCheck()">🔄 重新查詢</button>`;
            }
        }

        async function manualViolationCheck() {
            const idNumber  = document.getElementById('r-idNumber')?.value?.trim();
            const birthDate = document.getElementById('r-birthDate')?.value?.trim();
            const licenseTypeEl = document.querySelector('#documentModal .info-value span');

            if (!idNumber || !birthDate) {
                alert('請填寫身分證字號與出生日期（格式：YYYMMDD，例：0800402）');
                return;
            }

            // 取得當前駕照種類（從 DOM 讀取）
            const licenseTypeRows = document.querySelectorAll('#documentModal .info-row');
            let licenseType = '';
            licenseTypeRows.forEach(row => {
                if (row.querySelector('.info-label')?.textContent === '駕照種類') {
                    licenseType = row.querySelector('.info-value span')?.textContent || '';
                }
            });

            const validType = isValidLicenseType(licenseType);
            await runViolationCheck(idNumber, birthDate, true, validType, licenseType);
        }

        function showError(message) {
            const area = document.getElementById('loginError') || document.getElementById('messageArea');
            area.innerHTML = `<div class="error-message">❌ ${message}</div>`;
            setTimeout(() => {
                area.innerHTML = '';
            }, 5000);
        }

        function showSuccess(message) {
            const area = document.getElementById('messageArea');
            area.innerHTML = `<div class="success-message">✓ ${message}</div>`;
            setTimeout(() => {
                area.innerHTML = '';
            }, 3000);
        }

        function closeModal() {
            document.getElementById('documentModal').classList.remove('active');
        }
    </script>
</body>
</html>
