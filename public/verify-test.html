<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR 測試 — Ionex ID Verify</title>
  <link rel="stylesheet" href="/css/shadcn.css">
  <script src="/nav.js"></script>
  <style>
    .page { max-width: 1000px; margin: 0 auto; padding: 28px 20px 60px; }

    .page-title { margin-bottom: 4px; }
    .page-sub   { margin-bottom: 24px; }

    /* ── Layout ── */
    .layout { align-items: start; }

    .panel-body { padding: 20px; }

    /* ── Input Tabs ── */
    .tabs-wrap { padding: 16px 20px 0; }
    .tab-content { display: none; padding: 20px; }
    .tab-content.active { display: block; }

    /* Upload area */
    .upload-area {
      border: 2px dashed hsl(var(--border)); border-radius: var(--radius);
      padding: 36px 20px; text-align: center; cursor: pointer;
      transition: all .2s; background: hsl(var(--secondary));
    }
    .upload-area:hover, .upload-area.dragover {
      border-color: hsl(var(--primary)); background: hsl(var(--accent));
    }
    .upload-icon { font-size: 36px; margin-bottom: 8px; }
    .upload-text { font-size: 14px; color: hsl(var(--muted-foreground)); }
    .upload-sub  { font-size: 12px; color: hsl(var(--muted-foreground)); margin-top: 4px; }
    #fileInput { display: none; }

    /* Preview */
    .preview-wrap { margin-top: 14px; display: none; }
    .preview-wrap img { max-width: 100%; border-radius: calc(var(--radius) - 2px); border: 1px solid hsl(var(--border)); }
    .preview-name { font-size: 12px; color: hsl(var(--muted-foreground)); margin-top: 6px; }

    /* ── Result Panel ── */
    .result-empty {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 340px; color: hsl(var(--muted-foreground)); gap: 10px;
    }
    .result-empty-icon { font-size: 48px; }
    .result-empty p { font-size: 14px; }

    .result-content { padding: 20px; }

    .banner-icon { font-size: 20px; }

    /* Result fields (OCR output key/value boxes — distinct from shared .field input-wrapper) */
    .result-field-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    @media (max-width: 480px) { .result-field-grid { grid-template-columns: 1fr; } }

    .result-field {
      background: hsl(var(--secondary)); border-radius: calc(var(--radius) - 2px); padding: 10px 14px;
      border-left: 3px solid hsl(var(--primary));
    }
    .result-field.missing { border-left-color: hsl(var(--destructive)); background: hsl(var(--destructive) / .06); }
    .result-field-label { font-size: 11px; font-weight: 700; color: hsl(var(--muted-foreground)); text-transform: uppercase; margin-bottom: 3px; }
    .result-field-value { font-size: 15px; font-weight: 600; }
    .result-field-value.empty { color: hsl(var(--muted-foreground)); font-style: italic; font-size: 13px; font-weight: 400; }

    /* Confidence */
    .confidence-row {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px; font-size: 13px; color: hsl(var(--secondary-foreground));
    }
    .confidence-bar-wrap {
      flex: 1; height: 8px; background: hsl(var(--secondary)); border-radius: 4px; overflow: hidden;
    }
    .confidence-bar { height: 100%; border-radius: 4px; transition: width .4s; }
    .confidence-val { font-weight: 700; min-width: 44px; text-align: right; }

    /* Session ID */
    .session-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      background: hsl(var(--secondary)); border-radius: calc(var(--radius) - 2px); padding: 8px 12px;
      margin-bottom: 16px;
    }
    .session-label { font-size: 11px; font-weight: 700; color: hsl(var(--muted-foreground)); text-transform: uppercase; }
    .session-id { font-family: monospace; font-size: 12px; color: hsl(var(--secondary-foreground)); flex: 1; min-width: 80px; overflow: hidden; text-overflow: ellipsis; }
    .session-copy {
      font-size: 11px; padding: 5px 10px; border-radius: calc(var(--radius) - 4px);
      border: 1px solid hsl(var(--border)); background: hsl(var(--card)); cursor: pointer; color: hsl(var(--muted-foreground));
      transition: all .15s; white-space: nowrap;
    }
    .session-copy:hover { border-color: hsl(var(--primary)); color: hsl(var(--primary)); }
    .session-err-link {
      font-size: 11px; color: hsl(var(--primary)); text-decoration: none; white-space: nowrap;
    }
    .session-err-link:hover { text-decoration: underline; }

    /* Raw OCR */
    .raw-toggle {
      width: 100%; text-align: left; padding: 8px 0;
      border: none; background: none; font-size: 13px; font-weight: 600;
      color: hsl(var(--muted-foreground)); cursor: pointer; display: flex; align-items: center; gap: 6px;
      border-top: 1px solid hsl(var(--border)); margin-top: 4px;
    }
    .raw-toggle:hover { color: hsl(var(--foreground)); }
    .raw-arrow { transition: transform .2s; }
    .raw-text {
      margin-top: 10px; background: hsl(222 30% 14%); color: hsl(220 20% 90%);
      border-radius: calc(var(--radius) - 2px); padding: 14px; font-size: 12px; font-family: monospace;
      line-height: 1.7; white-space: pre-wrap; word-break: break-all; max-height: 240px;
      overflow-y: auto; display: none;
    }

    @media (max-width: 640px) {
      .session-row { flex-direction: column; align-items: stretch; }
      .session-id { min-width: 0; }
    }
  </style>
</head>
<body>
<div class="page">
  <h1 class="page-title text-xl font-bold">OCR 測試</h1>
  <p class="page-sub text-sm text-muted">上傳圖片或貼上 URL，快速測試身分證 / 駕照辨識效果</p>

  <div class="layout grid grid-cols-2 gap-4">

    <!-- Left: Input Panel -->
    <div class="panel card">
      <!-- Tabs -->
      <div class="tabs-wrap">
        <div class="tabs-list">
          <button class="tab tabs-trigger active" data-tab="url">透過 URL</button>
          <button class="tab tabs-trigger" data-tab="upload">上傳圖片</button>
        </div>
      </div>

      <!-- URL tab -->
      <div class="tab-content active" id="tab-url">
        <div class="field">
          <label class="label">圖片 URL</label>
          <input type="url" id="imageUrl" class="input" placeholder="https://example.com/id-card.jpg">
        </div>
        <div id="urlPreview" class="preview-wrap">
          <img id="urlPreviewImg" src="" alt="預覽">
        </div>
      </div>

      <!-- Upload tab -->
      <div class="tab-content" id="tab-upload">
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
          <div class="upload-icon">📁</div>
          <div class="upload-text">點擊選擇或拖曳圖片至此</div>
          <div class="upload-sub">支援 JPG、PNG、WEBP，最大 10 MB</div>
        </div>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">
        <div id="uploadPreview" class="preview-wrap">
          <img id="uploadPreviewImg" src="" alt="預覽">
          <div class="preview-name" id="uploadFileName"></div>
        </div>
      </div>

      <!-- Common Options -->
      <div style="padding: 0 20px 20px;">
        <div class="field">
          <label class="label">證件類型</label>
          <select id="documentType" class="select">
            <option value="auto">自動辨識</option>
            <option value="id_card">身分證</option>
            <option value="driving_license">駕照</option>
          </select>
        </div>
        <div class="field">
          <label class="label">使用者姓名（輔助辨識，可選）</label>
          <input type="text" id="displayName" class="input" placeholder="小王">
        </div>
        <button class="btn btn-primary btn-block btn-lg" id="submitBtn" onclick="submit()">開始辨識</button>
      </div>
    </div>

    <!-- Right: Result Panel -->
    <div class="panel card">
      <div class="card-header"><div class="card-title">辨識結果</div></div>
      <div id="resultArea">
        <div class="result-empty">
          <div class="result-empty-icon">🪪</div>
          <p>輸入圖片後點擊「開始辨識」</p>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  let currentTab = 'url';
  let selectedFile = null;
  let showRaw = false;

  // ── Tab switching ────────────────────────────────────────────────────────────
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      document.getElementById('tab-' + currentTab).classList.add('active');
    });
  });

  // ── URL preview ──────────────────────────────────────────────────────────────
  document.getElementById('imageUrl').addEventListener('input', function () {
    const url = this.value.trim();
    const wrap = document.getElementById('urlPreview');
    const img  = document.getElementById('urlPreviewImg');
    if (url.startsWith('http')) {
      img.src = url;
      wrap.style.display = 'block';
      img.onerror = () => { wrap.style.display = 'none'; };
    } else {
      wrap.style.display = 'none';
    }
  });

  // ── File upload ──────────────────────────────────────────────────────────────
  document.getElementById('fileInput').addEventListener('change', function () {
    if (!this.files[0]) return;
    selectedFile = this.files[0];
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('uploadPreviewImg').src = e.target.result;
      document.getElementById('uploadPreview').style.display = 'block';
      document.getElementById('uploadFileName').textContent = selectedFile.name + ' (' + (selectedFile.size / 1024).toFixed(1) + ' KB)';
    };
    reader.readAsDataURL(selectedFile);
  });

  const uploadArea = document.getElementById('uploadArea');
  uploadArea.addEventListener('dragover',  e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
  uploadArea.addEventListener('dragleave', ()  => uploadArea.classList.remove('dragover'));
  uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (!f) return;
    document.getElementById('fileInput').files = e.dataTransfer.files;
    document.getElementById('fileInput').dispatchEvent(new Event('change'));
  });

  // ── URL params auto-load ─────────────────────────────────────────────────────
  (function () {
    const p = new URLSearchParams(window.location.search);
    if (p.get('url')) {
      document.getElementById('imageUrl').value = p.get('url');
      document.getElementById('imageUrl').dispatchEvent(new Event('input'));
    }
    if (p.get('type')) document.getElementById('documentType').value = p.get('type');
    if (p.get('name')) document.getElementById('displayName').value = p.get('name');
  })();

  // ── Submit ───────────────────────────────────────────────────────────────────
  async function submit() {
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="border-color:rgba(255,255,255,.4);border-top-color:#fff;"></span>辨識中...';
    showResult(null, 'loading');

    try {
      let data;
      if (currentTab === 'url') {
        const url = document.getElementById('imageUrl').value.trim();
        if (!url) { alert('請輸入圖片 URL'); reset(); return; }
        const body = {
          imageUrl: url,
          documentType: document.getElementById('documentType').value,
          displayName: document.getElementById('displayName').value.trim() || undefined,
        };
        const r = await fetch('/api/verify/url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        data = await r.json();
      } else {
        if (!selectedFile) { alert('請選擇圖片檔案'); reset(); return; }
        const form = new FormData();
        form.append('image', selectedFile);
        form.append('documentType', document.getElementById('documentType').value);
        const dn = document.getElementById('displayName').value.trim();
        if (dn) form.append('displayName', dn);
        const r = await fetch('/api/verify/upload', { method: 'POST', body: form });
        data = await r.json();
      }
      showResult(data);
    } catch (e) {
      showResult({ success: false, error: e.message || '網路錯誤' });
    } finally {
      reset();
    }
  }

  function reset() {
    const btn = document.getElementById('submitBtn');
    btn.disabled = false;
    btn.textContent = '開始辨識';
  }

  // ── Render Result ────────────────────────────────────────────────────────────
  const FIELD_LABELS = {
    idNumber:      '身分證字號',
    name:          '姓名',
    gender:        '性別',
    birthDate:     '出生日期',
    issueDate:     '發證日期',
    issueLocation: '發證地',
    licenseNumber: '駕照號碼',
    licenseType:   '駕照種類',
  };

  function showResult(data, state) {
    const area = document.getElementById('resultArea');

    if (state === 'loading') {
      area.innerHTML = `<div class="result-empty"><div class="result-empty-icon" style="animation:spin .7s linear infinite">⟳</div><p>辨識中，請稍候...</p></div>`;
      return;
    }

    if (!data) {
      area.innerHTML = `<div class="result-empty"><div class="result-empty-icon">🪪</div><p>輸入圖片後點擊「開始辨識」</p></div>`;
      return;
    }

    if (!data.success && !data.data) {
      area.innerHTML = `
        <div class="result-content">
          <div class="alert alert-destructive"><span class="banner-icon">❌</span>${esc(data.error || '辨識失敗')}</div>
          ${sessionBlock(data.sessionId)}
        </div>`;
      return;
    }

    const d = data.data || {};
    const v = data.validation || {};
    const conf = data.confidence || 0;
    const missing = v.missingFields || [];
    const isComplete = v.isComplete;
    const isSuccess  = data.success && isComplete;

    const banner = isSuccess
      ? `<div class="alert alert-success"><span class="banner-icon">✅</span>辨識成功，所有欄位完整</div>`
      : isComplete === false
      ? `<div class="alert alert-warning"><span class="banner-icon">⚠️</span>辨識完成，但部分欄位缺失：${missing.join('、')}</div>`
      : `<div class="alert alert-destructive"><span class="banner-icon">❌</span>${esc(data.message || '辨識失敗')}</div>`;

    const confColor = conf >= 70 ? 'hsl(142 43% 42%)' : conf >= 40 ? 'hsl(38 92% 45%)' : 'hsl(0 72% 51%)';

    const fieldOrder = ['idNumber','licenseNumber','name','gender','birthDate','issueDate','issueLocation','licenseType'];
    const fields = fieldOrder.filter(k => k in d).map(k => {
      const val = d[k];
      const isMissing = !val;
      return `
        <div class="result-field${isMissing ? ' missing' : ''}">
          <div class="result-field-label">${FIELD_LABELS[k] || k}</div>
          <div class="result-field-value${isMissing ? ' empty' : ''}">${isMissing ? '未辨識' : esc(val)}</div>
        </div>`;
    }).join('');

    const rawText = (data.rawText || '').trim();
    const rawBlock = rawText ? `
      <button class="raw-toggle" onclick="toggleRaw(this)">
        <span class="raw-arrow">▶</span> 原始 OCR 文字
      </button>
      <pre class="raw-text">${esc(rawText)}</pre>` : '';

    area.innerHTML = `
      <div class="result-content">
        ${banner}
        <div class="confidence-row">
          <span>信心值</span>
          <div class="confidence-bar-wrap">
            <div class="confidence-bar" style="width:${conf}%;background:${confColor}"></div>
          </div>
          <span class="confidence-val" style="color:${confColor}">${conf.toFixed(1)}%</span>
        </div>
        <div class="result-field-grid">${fields}</div>
        ${sessionBlock(data.sessionId)}
        ${rawBlock}
      </div>`;
  }

  function sessionBlock(id) {
    if (!id) return '';
    const errUrl = `/error-logs.html?sessionId=${encodeURIComponent(id)}`;
    return `
      <div class="session-row">
        <span class="session-label">Session</span>
        <span class="session-id" title="${id}">${id}</span>
        <button class="session-copy" onclick="copySession('${id}')">複製</button>
        <a class="session-err-link" href="${errUrl}" target="_blank">查錯誤 →</a>
      </div>`;
  }

  function toggleRaw(btn) {
    const pre = btn.nextElementSibling;
    const open = pre.style.display === 'block';
    pre.style.display = open ? 'none' : 'block';
    btn.querySelector('.raw-arrow').style.transform = open ? '' : 'rotate(90deg)';
  }

  function copySession(id) {
    navigator.clipboard.writeText(id).catch(() => {});
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
