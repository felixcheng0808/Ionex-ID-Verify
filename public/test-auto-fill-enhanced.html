<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身分證辨識 + 自動填寫測試 (完整版)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            position: relative;
            top: 2px;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            transition: all 0.3s;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 50px;
            color: #667eea;
            margin-bottom: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .url-input-area {
            margin-bottom: 20px;
        }

        .url-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .url-examples {
            background: #f8f9ff;
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
        }

        .url-examples-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .url-example {
            color: #667eea;
            cursor: pointer;
            padding: 4px 0;
            transition: color 0.2s;
        }

        .url-example:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .options {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .option {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .option:last-child {
            margin-bottom: 0;
        }

        .option label {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            width: 100%;
        }

        .option input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            cursor: pointer;
        }

        .option-text {
            flex: 1;
        }

        .option-title {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 3px;
        }

        .option-desc {
            font-size: 12px;
            color: #666;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 10px;
            /* 手機觸控優化 */
            -webkit-tap-highlight-color: rgba(102, 126, 234, 0.3);
            touch-action: manipulation;
            user-select: none;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            display: block;
        }

        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            display: block;
        }

        .result-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .result-title.success {
            color: #28a745;
        }

        .result-title.error {
            color: #dc3545;
        }

        .result-content {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .result-section {
            margin-bottom: 15px;
        }

        .result-section:last-child {
            margin-bottom: 0;
        }

        .result-section-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .result-item {
            display: flex;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            font-weight: bold;
            color: #666;
            min-width: 100px;
        }

        .result-value {
            color: #333;
            flex: 1;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .preview {
            display: none;
            margin-top: 15px;
            text-align: center;
        }

        .preview.active {
            display: block;
        }

        .preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .preview-info {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        .info-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .copy-btn {
            margin-left: 10px;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: rgba(102, 126, 234, 0.3);
        }

        .copy-btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .copy-btn.copied {
            background: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🪪 身分證辨識 + 自動填寫</h1>
        <p class="subtitle">支援上傳圖片或提供 URL 進行辨識，可選擇自動填寫監理服務網表單</p>

        <div class="tabs">
            <button class="tab active" data-tab="upload">📤 上傳圖片</button>
            <button class="tab" data-tab="url">🔗 圖片 URL</button>
        </div>

        <!-- 上傳圖片 Tab -->
        <div class="tab-content active" id="upload-tab">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <p style="font-size: 16px; color: #333; margin-bottom: 5px;">
                    點擊或拖曳圖片至此處
                </p>
                <p style="font-size: 12px; color: #666;">
                    支援 JPG, PNG, JPEG 格式
                </p>
                <input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png">
            </div>

            <div class="preview" id="uploadPreview">
                <img id="uploadPreviewImage" src="" alt="預覽">
                <div class="preview-info" id="uploadPreviewInfo"></div>
            </div>
        </div>

        <!-- URL Tab -->
        <div class="tab-content" id="url-tab">
            <div class="url-input-area">
                <form id="urlForm">
                    <h3 style="color: #333; margin-bottom: 15px; font-size: 16px;">🪪 身分證圖片 URL</h3>
                    <div class="url-input-group">
                        <input type="url" id="urlInput" placeholder="請輸入身分證圖片的 URL (例如: https://example.com/id-card.jpg)" required>
                    </div>

                    <h3 style="color: #333; margin: 20px 0 15px 0; font-size: 16px;">🚗 駕照圖片 URL (選填)</h3>
                    <div class="url-input-group">
                        <input type="url" id="drivingLicenseUrlInput" placeholder="請輸入駕照圖片的 URL (選填)">
                    </div>

                    <button type="submit" style="margin-top: 15px;">🔍 開始辨識</button>
                </form>

                <div class="url-examples">
                    <div class="url-examples-title">💡 範例 URL (點擊使用):</div>
                    <div class="url-example" data-url="https://ionexenergy-nex-cloud.s3.us-west-2.amazonaws.com/id-card-sample.jpg">
                        範例 1: S3 公開圖片
                    </div>
                    <div class="url-example" data-url="https://example.com/public/id-card.jpg">
                        範例 2: 一般 HTTP 圖片
                    </div>
                </div>
            </div>

            <!-- 身分證辨識結果 -->
            <div class="result" id="idCardResult" style="margin-top: 20px;"></div>

            <div class="preview" id="urlPreview">
                <img id="urlPreviewImage" src="" alt="預覽">
                <div class="preview-info" id="urlPreviewInfo"></div>
            </div>

            <div class="preview" id="drivingLicensePreview" style="margin-top: 20px;">
                <img id="drivingLicensePreviewImage" src="" alt="駕照預覽">
                <div class="preview-info" id="drivingLicensePreviewInfo"></div>
            </div>

            <!-- 駕照辨識結果 -->
            <div class="result" id="drivingLicenseResult" style="margin-top: 20px;"></div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>處理中，請稍候...</p>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        // 從 URL 參數載入圖片
        function loadFromUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const imageUrl = params.get('imageUrl');
            const drivingLicenseUrl = params.get('drivingLicenseUrl');
            const userName = params.get('userName');

            console.log('=== loadFromUrlParams 被呼叫 ===');
            console.log('當前 URL:', window.location.href);
            console.log('URL 參數:');
            console.log('  - imageUrl:', imageUrl);
            console.log('  - drivingLicenseUrl:', drivingLicenseUrl);
            console.log('  - userName:', userName);

            if (!imageUrl && !drivingLicenseUrl) {
                console.log('沒有偵測到任何 URL 參數，略過自動載入');
                return;
            }

            // 使用較長的延遲確保 DOM 完全載入
            setTimeout(() => {
                console.log('開始處理 URL 參數...');

                // 1. 切換到 URL tab
                const urlTab = document.querySelector('[data-tab="url"]');
                if (urlTab) {
                    console.log('✓ 找到 URL tab，點擊切換');
                    urlTab.click();
                } else {
                    console.error('✗ 找不到 URL tab 元素');
                    return;
                }

                // 2. 等待 tab 切換完成後再填入資料
                setTimeout(() => {
                    // 填入身分證 URL
                    if (imageUrl) {
                        const urlInput = document.getElementById('urlInput');
                        if (urlInput) {
                            console.log('✓ 找到身分證 URL 輸入框');
                            console.log('填入身分證 URL:', imageUrl);
                            urlInput.value = imageUrl;
                            // 直接載入預覽並辨識
                            setTimeout(() => {
                                console.log('開始載入身分證預覽...');
                                loadUrlPreview(imageUrl);
                            }, 200);
                        } else {
                            console.error('✗ 找不到身分證 URL 輸入框 (urlInput)');
                        }
                    }

                    // 填入駕照 URL
                    if (drivingLicenseUrl) {
                        setTimeout(() => {
                            const drivingLicenseUrlInput = document.getElementById('drivingLicenseUrlInput');
                            if (drivingLicenseUrlInput) {
                                console.log('✓ 找到駕照 URL 輸入框');
                                console.log('填入駕照 URL:', drivingLicenseUrl);
                                drivingLicenseUrlInput.value = drivingLicenseUrl;
                                // 直接載入預覽並辨識
                                setTimeout(() => {
                                    console.log('開始載入駕照預覽...');
                                    loadDrivingLicensePreview(drivingLicenseUrl);
                                }, 200);
                            } else {
                                console.error('✗ 找不到駕照 URL 輸入框 (drivingLicenseUrlInput)');
                            }
                        }, 600);
                    }

                    // 如果有使用者名稱,顯示訊息
                    if (userName) {
                        const subtitle = document.querySelector('.subtitle');
                        if (subtitle) {
                            console.log('✓ 更新使用者名稱:', userName);
                            subtitle.textContent = `正在處理 ${userName} 的證件 - 支援上傳圖片或提供 URL 進行辨識`;
                        }
                    }
                }, 300); // tab 切換後延遲
            }, 200); // 初始延遲
        }

        // Tab 切換
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;

                tabs.forEach(t => t.classList.remove('active'));
                tabContents.forEach(tc => tc.classList.remove('active'));

                tab.classList.add('active');
                document.getElementById(`${tabName}-tab`).classList.add('active');

            });
        });

        // 上傳功能
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadPreview = document.getElementById('uploadPreview');
        const uploadPreviewImage = document.getElementById('uploadPreviewImage');
        const uploadPreviewInfo = document.getElementById('uploadPreviewInfo');

        let selectedFile = null;

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file) return;

            if (!file.type.match('image/(jpeg|jpg|png)')) {
                alert('請選擇 JPG 或 PNG 格式的圖片');
                return;
            }

            selectedFile = file;

            const reader = new FileReader();
            reader.onload = (e) => {
                uploadPreviewImage.src = e.target.result;
                uploadPreview.classList.add('active');
                uploadPreviewInfo.textContent = `檔案: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
            };
            reader.readAsDataURL(file);
        }

        // URL 功能
        const urlInput = document.getElementById('urlInput');
        const urlPreview = document.getElementById('urlPreview');
        const urlPreviewImage = document.getElementById('urlPreviewImage');
        const urlPreviewInfo = document.getElementById('urlPreviewInfo');
        const urlExamples = document.querySelectorAll('.url-example');

        urlExamples.forEach(example => {
            example.addEventListener('click', () => {
                const url = example.dataset.url;
                urlInput.value = url;
                // 只填入 URL，不自動觸發辨識
                // 用戶需要按 Enter 或點擊「開始辨識」按鈕
            });
        });

        function loadUrlPreview(url) {
            urlPreviewImage.src = url;
            urlPreviewImage.onload = () => {
                urlPreview.classList.add('active');
                urlPreviewInfo.textContent = '身分證';
                // 自動辨識身分證
                analyzeIDCard(url);
            };
            urlPreviewImage.onerror = () => {
                urlPreview.classList.remove('active');
                urlPreviewInfo.textContent = '無法載入圖片預覽';
            };
        }

        // 駕照預覽
        const drivingLicensePreview = document.getElementById('drivingLicensePreview');
        const drivingLicensePreviewImage = document.getElementById('drivingLicensePreviewImage');
        const drivingLicensePreviewInfo = document.getElementById('drivingLicensePreviewInfo');

        function loadDrivingLicensePreview(url) {
            drivingLicensePreviewImage.src = url;
            drivingLicensePreviewImage.onload = () => {
                drivingLicensePreview.classList.add('active');
                drivingLicensePreviewInfo.textContent = '駕照';
                // 自動辨識駕照
                analyzeDrivingLicense(url);
            };
            drivingLicensePreviewImage.onerror = () => {
                drivingLicensePreview.classList.remove('active');
                drivingLicensePreviewInfo.textContent = '無法載入駕照圖片預覽';
            };
        }

        // Form 提交監聽 - 只在按下 Enter 或點擊按鈕時觸發
        const urlForm = document.getElementById('urlForm');
        const drivingLicenseUrlInput = document.getElementById('drivingLicenseUrlInput');

        if (urlForm) {
            urlForm.addEventListener('submit', (e) => {
                e.preventDefault(); // 防止頁面重新載入

                const idCardUrl = urlInput.value.trim();
                const drivingLicenseUrl = drivingLicenseUrlInput.value.trim();

                console.log('表單提交 - 身分證 URL:', idCardUrl);
                console.log('表單提交 - 駕照 URL:', drivingLicenseUrl);

                // 載入身分證預覽並辨識
                if (idCardUrl) {
                    loadUrlPreview(idCardUrl);
                }

                // 載入駕照預覽並辨識（如果有填寫）
                if (drivingLicenseUrl) {
                    loadDrivingLicensePreview(drivingLicenseUrl);
                }
            });
        }

        // 自動辨識身分證
        async function analyzeIDCard(imageUrl) {
            const idCardResult = document.getElementById('idCardResult');

            // 顯示載入中
            idCardResult.style.display = 'block';
            idCardResult.className = 'result';
            idCardResult.innerHTML = `
                <div style="text-align: center; padding: 20px; color: #666;">
                    <div class="spinner" style="margin: 0 auto 15px;"></div>
                    <p>正在辨識身分證資料...</p>
                </div>
            `;

            try {
                const response = await fetch('/api/verify/url', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        imageUrl: imageUrl
                    })
                });

                const data = await response.json();
                displayIDCardResult(data);

            } catch (error) {
                idCardResult.className = 'result error';
                idCardResult.innerHTML = `
                    <div class="result-title error">✗ 身分證辨識失敗</div>
                    <div class="result-content">
                        <p style="color: #721c24;">${error.message || '網路錯誤'}</p>
                    </div>
                `;
            }
        }

        // 顯示身分證辨識結果
        function displayIDCardResult(data) {
            const idCardResult = document.getElementById('idCardResult');
            idCardResult.className = 'result';
            idCardResult.classList.add(data.success ? 'success' : 'error');

            let html = `
                <div class="result-title ${data.success ? 'success' : 'error'}">
                    ${data.success ? '✓' : '✗'} 身分證辨識${data.success ? '成功' : '失敗'}
                </div>
            `;

            if (data.success && data.data) {
                html += `
                    <div class="result-content">
                        <div class="result-section">
                            <div class="result-section-title">🪪 身分證辨識結果</div>
                `;

                // 轉換出生日期為 YYYMMDD 格式
                let birthDateFormatted = data.data.birthDate;
                console.log('原始出生日期:', data.data.birthDate);

                if (data.data.birthDate) {
                    // 格式1: "民國XX年XX月XX日" 或 "XX年XX月XX日"
                    const match = data.data.birthDate.match(/(?:民國)?(\d+)年(\d+)月(\d+)日/);
                    if (match) {
                        const year = match[1].padStart(3, '0');
                        const month = match[2].padStart(2, '0');
                        const day = match[3].padStart(2, '0');
                        birthDateFormatted = `${year}${month}${day}`;
                        console.log('匹配格式1 (年月日) - 轉換後:', birthDateFormatted);
                    } else {
                        // 格式2: "XX.XX.XX" 或 "XX-XX-XX" 或 "XXXXXX"
                        const dateMatch = data.data.birthDate.match(/(\d{2,3})[\.\-\/]?(\d{1,2})[\.\-\/]?(\d{1,2})/);
                        if (dateMatch) {
                            const year = dateMatch[1].padStart(3, '0');
                            const month = dateMatch[2].padStart(2, '0');
                            const day = dateMatch[3].padStart(2, '0');
                            birthDateFormatted = `${year}${month}${day}`;
                            console.log('匹配格式2 (數字) - 轉換後:', birthDateFormatted);
                        } else {
                            console.log('無法匹配日期格式，使用原始值');
                        }
                    }
                }

                console.log('最終顯示的出生日期:', birthDateFormatted);

                // 顯示所有辨識到的資料
                const fields = [
                    { key: 'idNumber', label: '身分證字號', copyable: true },
                    { key: 'name', label: '姓名' },
                    { key: 'gender', label: '性別' },
                    { key: 'birthDate', label: '出生日期', copyable: true, displayValue: birthDateFormatted },
                    { key: 'issueDate', label: '發證日期' },
                    { key: 'issueLocation', label: '發證地點' }
                ];

                fields.forEach(field => {
                    if (data.data[field.key]) {
                        const displayValue = field.displayValue || data.data[field.key];
                        const copyValue = field.key === 'birthDate' ? birthDateFormatted : data.data[field.key];
                        const copyButton = field.copyable ?
                            `<button class="copy-btn" onclick="copyToClipboard('${copyValue}', this)">📋 複製</button>` : '';
                        html += `
                            <div class="result-item">
                                <div class="result-label">${field.label}:</div>
                                <div class="result-value">${displayValue}${copyButton}</div>
                            </div>
                        `;
                    }
                });

                // 顯示原始文字 (如果有)
                if (data.data.rawText) {
                    html += `
                        <div class="result-item" style="margin-top: 15px;">
                            <div class="result-label">原始辨識文字:</div>
                            <div class="result-value" style="white-space: pre-wrap; font-size: 12px; color: #666; max-height: 200px; overflow-y: auto;">${data.data.rawText}</div>
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;

                // 新增開啟監理所網站按鈕
                html += `
                    <div style="margin-top: 20px; text-align: center;">
                        <button onclick="window.open('https://www.mvdis.gov.tw/m3-emv-vil/vil/driverLicensePenalty#gsc.tab=0', '_blank')"
                                style="width: 100%; padding: 15px; background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
                                       color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold;
                                       cursor: pointer; box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);">
                            🌐 開啟監理所網站查詢違規記錄
                        </button>
                        <p style="color: #666; font-size: 13px; margin-top: 10px;">
                            💡 提示：使用上方複製按鈕複製身分證字號和生日後，點此開啟監理所網站手動填寫
                        </p>
                    </div>
                `;
            } else if (data.error) {
                html += `
                    <div class="result-content">
                        <p style="color: #721c24;">${data.error}</p>
                    </div>
                `;
            }

            idCardResult.innerHTML = html;
            idCardResult.style.display = 'block';
        }

        // 自動辨識駕照
        async function analyzeDrivingLicense(imageUrl) {
            const drivingLicenseResult = document.getElementById('drivingLicenseResult');

            // 顯示載入中
            drivingLicenseResult.style.display = 'block';
            drivingLicenseResult.className = 'result';
            drivingLicenseResult.innerHTML = `
                <div style="text-align: center; padding: 20px; color: #666;">
                    <div class="spinner" style="margin: 0 auto 15px;"></div>
                    <p>正在辨識駕照資料...</p>
                </div>
            `;

            try {
                const response = await fetch('/api/verify/url', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        imageUrl: imageUrl
                    })
                });

                const data = await response.json();
                displayDrivingLicenseResult(data);

            } catch (error) {
                drivingLicenseResult.className = 'result error';
                drivingLicenseResult.innerHTML = `
                    <div class="result-title error">✗ 駕照辨識失敗</div>
                    <div class="result-content">
                        <p style="color: #721c24;">${error.message || '網路錯誤'}</p>
                    </div>
                `;
            }
        }

        // 顯示駕照辨識結果
        function displayDrivingLicenseResult(data) {
            const drivingLicenseResult = document.getElementById('drivingLicenseResult');
            drivingLicenseResult.className = 'result';
            drivingLicenseResult.classList.add(data.success ? 'success' : 'error');

            let html = `
                <div class="result-title ${data.success ? 'success' : 'error'}">
                    ${data.success ? '✓' : '✗'} 駕照辨識${data.success ? '成功' : '失敗'}
                </div>
            `;

            if (data.success && data.data) {
                html += `
                    <div class="result-content">
                        <div class="result-section">
                            <div class="result-section-title">🚗 駕照辨識結果</div>
                `;

                // 顯示所有辨識到的資料
                const fields = [
                    { key: 'idNumber', label: '身分證字號' },
                    { key: 'name', label: '姓名' },
                    { key: 'gender', label: '性別' },
                    { key: 'birthDate', label: '出生日期' },
                    { key: 'issueDate', label: '發證日期' },
                    { key: 'issueLocation', label: '發證地點' },
                    { key: 'licenseNumber', label: '駕照號碼' },
                    { key: 'licenseType', label: '駕照種類' },
                    { key: 'validFrom', label: '有效期開始' },
                    { key: 'validTo', label: '有效期結束' },
                    { key: 'address', label: '地址' }
                ];

                fields.forEach(field => {
                    if (data.data[field.key]) {
                        html += `
                            <div class="result-item">
                                <div class="result-label">${field.label}:</div>
                                <div class="result-value">${data.data[field.key]}</div>
                            </div>
                        `;
                    }
                });

                // 顯示原始文字 (如果有)
                if (data.data.rawText) {
                    html += `
                        <div class="result-item" style="margin-top: 15px;">
                            <div class="result-label">原始辨識文字:</div>
                            <div class="result-value" style="white-space: pre-wrap; font-size: 12px; color: #666; max-height: 200px; overflow-y: auto;">${data.data.rawText}</div>
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            } else if (data.error) {
                html += `
                    <div class="result-content">
                        <p style="color: #721c24;">${data.error}</p>
                    </div>
                `;
            }

            drivingLicenseResult.innerHTML = html;
            drivingLicenseResult.style.display = 'block';
        }

        // 提交功能 (已改為 form submit，此處保留以避免錯誤)
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');

        // 只有當元素存在時才添加事件監聽器
        if (submitBtn) {
            submitBtn.addEventListener('click', async () => {
                console.log('開始辨識按鈕被點擊');
                const activeTab = document.querySelector('.tab.active').dataset.tab;
                console.log('當前 Tab:', activeTab);

                if (activeTab === 'upload') {
                    await submitUpload();
                } else {
                    await submitUrl();
                }
            });
        }

        async function submitUpload() {
            if (!selectedFile) return;

            submitBtn.disabled = true;
            loading.classList.add('active');
            result.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('image', selectedFile);

                const response = await fetch('/api/verify/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                displayResult(data);

            } catch (error) {
                displayResult({
                    success: false,
                    error: error.message || '網路錯誤'
                });
            } finally {
                loading.classList.remove('active');
                submitBtn.disabled = false;
            }
        }

        async function submitUrl() {
            const url = urlInput.value.trim();
            if (!url) {
                console.log('URL 為空,無法提交');
                return;
            }

            console.log('開始提交 URL:', url);
            submitBtn.disabled = true;
            loading.classList.add('active');
            result.style.display = 'none';

            try {
                console.log('發送 API 請求...');
                const response = await fetch('/api/verify/url', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        imageUrl: url
                    })
                });

                console.log('API 回應狀態:', response.status);
                const data = await response.json();
                console.log('API 回應資料:', data);
                displayResult(data);

            } catch (error) {
                console.error('提交失敗:', error);
                displayResult({
                    success: false,
                    error: error.message || '網路錯誤'
                });
            } finally {
                loading.classList.remove('active');
                submitBtn.disabled = false;
                console.log('請求完成');
            }
        }

        function displayResult(data) {
            result.className = 'result';
            result.classList.add(data.success ? 'success' : 'error');

            let html = `
                <div class="result-title ${data.success ? 'success' : 'error'}">
                    ${data.success ? '✓' : '✗'} ${data.message || (data.success ? '處理成功' : '處理失敗')}
                </div>
            `;

            if (data.success && data.data) {
                html += `
                    <div class="result-content">
                        <div class="result-section">
                            <div class="result-section-title">🪪 辨識結果</div>
                            <div class="result-item">
                                <div class="result-label">身分證字號:</div>
                                <div class="result-value">${data.data.idNumber || '未辨識'}</div>
                            </div>
                            <div class="result-item">
                                <div class="result-label">姓名:</div>
                                <div class="result-value">${data.data.name || '未辨識'}</div>
                            </div>
                            <div class="result-item">
                                <div class="result-label">性別:</div>
                                <div class="result-value">${data.data.gender || '未辨識'}</div>
                            </div>
                            <div class="result-item">
                                <div class="result-label">出生日期:</div>
                                <div class="result-value">${data.data.birthDate || '未辨識'}</div>
                            </div>
                            <div class="result-item">
                                <div class="result-label">發證日期:</div>
                                <div class="result-value">${data.data.issueDate || '未辨識'}</div>
                            </div>
                            <div class="result-item">
                                <div class="result-label">發證地點:</div>
                                <div class="result-value">${data.data.issueLocation || '未辨識'}</div>
                            </div>
                        </div>
                    </div>
                `;

                if (data.automation) {
                    html += `
                        <div class="result-content" style="margin-top: 15px;">
                            <div class="result-section">
                                <div class="result-section-title">🌐 自動填寫結果</div>
                                <div class="result-item">
                                    <div class="result-label">狀態:</div>
                                    <div class="result-value">${data.automation.success ? '✓ 成功' : '✗ 失敗'}</div>
                                </div>
                                <div class="result-item">
                                    <div class="result-label">訊息:</div>
                                    <div class="result-value">${data.automation.message}</div>
                                </div>
                                ${data.automation.data ? `
                                    <div class="result-item">
                                        <div class="result-label">生日格式:</div>
                                        <div class="result-value">${data.automation.data.birthDateFormatted}</div>
                                    </div>
                                    <div class="result-item">
                                        <div class="result-label">表單已填寫:</div>
                                        <div class="result-value">${data.automation.data.formFilled ? '是' : '否'}</div>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }
            } else if (data.error) {
                html += `
                    <div class="result-content">
                        <div class="result-section">
                            <div class="result-section-title">錯誤訊息</div>
                            <div style="color: #dc3545; padding: 10px;">${data.error}</div>
                        </div>
                    </div>
                `;
            }

            result.innerHTML = html;
        }

        // 複製到剪貼簿功能
        function copyToClipboard(text, button) {
            // 使用現代 Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    // 複製成功
                    const originalText = button.textContent;
                    button.textContent = '✓ 已複製';
                    button.classList.add('copied');

                    setTimeout(() => {
                        button.textContent = originalText;
                        button.classList.remove('copied');
                    }, 2000);
                }).catch(err => {
                    console.error('複製失敗:', err);
                    alert('複製失敗，請手動複製');
                });
            } else {
                // 降級方案：使用舊的 execCommand 方法
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.left = '-999999px';
                document.body.appendChild(textArea);
                textArea.select();

                try {
                    document.execCommand('copy');
                    const originalText = button.textContent;
                    button.textContent = '✓ 已複製';
                    button.classList.add('copied');

                    setTimeout(() => {
                        button.textContent = originalText;
                        button.classList.remove('copied');
                    }, 2000);
                } catch (err) {
                    console.error('複製失敗:', err);
                    alert('複製失敗，請手動複製');
                } finally {
                    document.body.removeChild(textArea);
                }
            }
        }

        // 頁面載入完成時執行 - 確保在所有腳本載入後執行
        console.log('腳本開始執行，document.readyState =', document.readyState);
        console.log('當前 URL:', window.location.href);

        if (document.readyState === 'loading') {
            console.log('等待 DOMContentLoaded 事件...');
            document.addEventListener('DOMContentLoaded', function() {
                console.log('DOMContentLoaded 事件觸發');
                loadFromUrlParams();
            });
        } else {
            // DOM 已經載入完成，直接執行
            console.log('DOM 已載入，直接執行 loadFromUrlParams');
            loadFromUrlParams();
        }

        // 額外保險：使用 window.onload
        window.addEventListener('load', function() {
            console.log('window.onload 事件觸發');
            // 檢查是否已經執行過
            const params = new URLSearchParams(window.location.search);
            if ((params.get('imageUrl') || params.get('drivingLicenseUrl')) && !window.urlParamsLoaded) {
                console.log('從 window.onload 執行 loadFromUrlParams (備用)');
                window.urlParamsLoaded = true;
                loadFromUrlParams();
            }
        });
    </script>
</body>
</html>
